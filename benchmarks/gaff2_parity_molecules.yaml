# GAFF2 Benchmark Curation - Core Tier
# ====================================
#
# Curated set of 11 molecules targeting proxide's 4 known GAFF2 gaps, plus
# explicitly required bridgehead aromatic and cross-conjugated polyene coverage.
#
# Gap targets:
# 1. h_ew: Hydrogen in electron-withdrawing environment (amides, enolates)
# 2. cc/cd/ce/cf: Conjugated carbon systems (sp2 carbons in conjugation)
# 3. cp: Aromatic carbon (bridgehead in fused aromatic systems)
# 4. Multi-ring: Complex multi-ring systems stressing multi-wildcard ATD rules
#
# Adversarial requirements (from pre-mortem review):
# - Bridgehead aromatic: An aromatic carbon in a bicyclic/fused system
# - Cross-conjugated polyene: Multiple C=C bonds not in direct conjugation
#
# Reference: audit findings in tests/test_gaff2_golden.py (commit 7e05237)
# Atom types verified against src/proxide/assets/gaff/dat/ATOMTYPE_GFF2.DEF

molecules:
  - name: "Benzene"
    smiles: "c1ccccc1"
    targets_gap:
      - "ca"  # Baseline aromatic carbon (ca per spec line 35: pure aromatic, no
              # neighbor-count constraint)
    tier: "core"
    description: "Simple aromatic baseline. All carbons should be typed as ca."
    notes: "CORRECTED 260819: previously documented as 'all cp', which was
      itself downstream of a confirmed parser bug (cp's required '3 aromatic
      neighbors' constraint was silently unenforced, so cp matched on ring
      size alone before ca ever got a chance). cp (spec line 33) additionally
      requires 3 aromatic heavy neighbors -- a fused-ring-junction pattern
      benzene's 2-aromatic-neighbor ring carbons don't have. See Biphenyl for
      a molecule that actually exercises real cp carbons."

  - name: "Toluene"
    smiles: "Cc1ccccc1"
    targets_gap:
      - "ca"  # Monosubstituted aromatic ring -- ipso carbon has one
              # non-aromatic (methyl) neighbor, so still fails cp's 3-aromatic-
              # neighbor requirement and correctly resolves to ca like the rest
    tier: "core"
    description: "Benzene with a single methyl substituent. All 6 ring carbons
      (including the ipso carbon attached to the methyl group) should be ca,
      not cp -- the ipso carbon has only 2 aromatic heavy neighbors plus one
      non-aromatic substituent."
    notes: "Added 260819 specifically to exercise the monosubstituted-ring
      case (as opposed to the unsubstituted-ring Benzene case above) that
      first surfaced the cp/ca bracket-pattern parsing bug."

  - name: "Naphthalene"
    smiles: "c1ccc2ccccc2c1"
    targets_gap:
      - "cp"  # BRIDGEHEAD AROMATIC - aromatic carbons at ring junction
      - "multi-ring"  # Two fused 6-membered rings (multi-wildcard ATD stress test)
    tier: "core"
    description: "Fused two-ring aromatic system. Tests bridgehead aromatic carbons (cp at the 4,5 fusion point) and multi-ring topology complexity."
    notes: "Naphthalene's bridgehead carbons (positions 4a and 8a) are aromatic and bonded to other aromatic carbons in a fused system. Note: The fusion carbons belong to TWO six-membered rings simultaneously, which may not strictly satisfy specs defining cp as requiring membership in exactly ONE six-membered ring (see biphenyl for comparison). This implementation treats cp's '1RG6' token as an exact ring count, so bridgeheads (2 six-rings) are excluded from cp -- all 10 naphthalene ring carbons, bridgeheads included, resolve to ca. CONFIRMED 260820 against a real external reference (antechamber/openmmforcefields GAFFTemplateGenerator, gaff-2.11 -- see scripts/validation/gaff2_external_reference.py); no longer just a documented reading. See tests/test_gaff2_golden.py::test_naphthalene_bridgehead_confirmed_by_external_reference."

  - name: "Biphenyl"
    smiles: "c1ccc(-c2ccccc2)cc1"
    targets_gap:
      - "cp"  # The 2 ipso/connector carbons genuinely have 3 aromatic heavy
              # neighbors (2 ring + 1 cross-ring) and should be cp; the other
              # 10 ring carbons have only 2 aromatic neighbors and are ca
    tier: "core"
    description: "Two separate benzene rings connected by a single C-C bond. The
      two ipso carbons (one per ring, at the connection point) should be cp;
      the remaining 10 ring carbons should be ca."
    notes: "CORRECTED 260819: previously documented as 'pure cp carbons', which
      was wrong for the same reason as Benzene above -- only the 2 carbons
      that are genuinely bonded to 3 aromatic heavy neighbors (the ring-ring
      connection points) satisfy cp's real neighbor-count requirement."

  - name: "Indene"
    smiles: "C1C=Cc2ccccc21"
    targets_gap:
      - "ca"  # CORRECTED 260820: NOT cp -- see notes
      - "multi-ring"  # Fused 5+6 rings
    tier: "core"
    description: "Bicyclic with fused 5-membered and 6-membered aromatic rings. The 5-membered ring contains one sp3 methylene (typed c5, the RG5 sp3-ring type) and two sp2 carbons (C=C, typed c2/ce), fused to the aromatic 6-membered ring (all 6 ring carbons typed ca, including both fusion atoms). Tests aromatic carbon typing in different ring contexts and multi-ring topology."
    notes: "CORRECTED 260820: previously claimed targets_gap: cp, but produces
      zero cp atoms. Unlike Naphthalene/Anthracene's ring-count-based
      exclusion, the mechanism here is the same as Toluene's: each 6-ring/
      5-ring fusion carbon has only 2 aromatic heavy neighbors (the adjacent
      benzo-ring atoms) plus 1 NON-aromatic heavy neighbor (the 5-ring's sp3
      CH2 or sp2 CH=), so it fails cp's f9 '3 aromatic heavy neighbors'
      requirement outright -- its ring-count token (1RG6) is actually
      satisfied (ring_counts_by_size={5:1,6:1}), it just never gets there.
      All 6 aromatic ring carbons resolve to ca."

  - name: "1,3-Butadiene"
    smiles: "C=CC=C"
    targets_gap:
      - "ce"  # CORRECTED 260820 -- see notes; was "cc/cd"
    tier: "core"
    description: "Classic conjugated diene. Terminal carbons (idx 0, 3) type as c2 (\"other sp2 C\", no conjugated-chain neighbor of their own); internal carbons (idx 1, 2) type as ce (sp2 in a conjugated chain -- each bonded to another sp2 carbon that itself has a double bond). Tests conjugated sp2 carbon discrimination."
    notes: "CORRECTED 260820: the original claim (\"terminal carbons... ce...
      internal carbons... cc\") was exactly backwards on both axes, and cc is
      structurally impossible here regardless (cc is the *ring*-conjugation
      family per spec lines 37-58; butadiene is acyclic). Verified via live
      run: idx0=c2, idx1=ce, idx2=ce, idx3=c2. ce's spec rule (lines 60-64)
      requires, via its f9 pattern, a neighbor reached over a *single-bond*
      edge (the \"SB'\" edge-direction suffix -- e.g. \"(C3[SB'])\"). A
      terminal =CH2 carbon's only heavy-atom bond is the double bond to the
      internal carbon, so it has no single-bonded heavy neighbor at all and
      cannot satisfy any of ce's 5 alternative f9 patterns -- it correctly
      falls through to c2 (\"other sp2 C\", spec line 70). The internal
      carbons each have exactly one single-bonded heavy neighbor (each
      other) satisfying the pattern, hence ce."

  - name: "Divinyl ketone"
    smiles: "C=CC(=O)C=C"
    targets_gap:
      - "cross-conjugated"  # CROSS-CONJUGATED POLYENE - vinyl groups conjugated to central carbonyl
    tier: "core"
    description: "Two vinyl groups (C=C) conjugated to a central carbonyl carbon (C=O). Tests cross-conjugated system with branching at a central sp2 carbon. Terminal vinyl carbons (idx 0, 5) type as c2; internal vinyl carbons (idx 1, 4 -- adjacent to the carbonyl) type as ce; the carbonyl carbon (idx 2) types as c."
    notes: "CORRECTED 260820: the original claim (\"ce or cs for vinyl\")
      overclaimed coverage -- only the internal vinyl carbons (bonded to the
      carbonyl carbon via a single edge) satisfy ce's f9 single-bonded-
      neighbor requirement; the terminal =CH2 carbons, same as
      1,3-Butadiene, have no single-bonded heavy neighbor (their only heavy
      bond is the terminal double bond) and fall through to c2. Verified via
      live run: idx0=c2, idx1=ce, idx2=c, idx3=o, idx4=ce, idx5=c2. Explicit
      adversarial requirement retained: genuine cross-conjugated polyene with
      two vinyl arms bonded to a common sp2 carbonyl center."

  - name: "Formamide"
    smiles: "NC=O"
    targets_gap:
      - "h_ew"  # Hydrogen on N in amide (electron-withdrawing C=O environment)
    tier: "core"
    description: "Primary amide (formamide). Tests h_ew: hydrogen on nitrogen bonded to carbonyl carbon. N should be n3 or similar; C should be c (carbonyl); critical hydrogen typing on N adjacent to C=O."
    notes: "Gap target: EW-counting for h on N in amide environments. This is the minimal amide test case."

  - name: "N-methylacetamide"
    smiles: "CC(=O)NC"
    targets_gap:
      - "h_ew"  # Secondary amide: H on N bonded to C=O
      - "c"  # Carbonyl carbon
    tier: "core"
    description: "Secondary amide. Tests h_ew with a methyl-substituted nitrogen and separate methyl on carbonyl. Stresses hydrogen typing in amide environment and carbonyl sp2 carbon (c type)."
    notes: "More complex amide variant testing both h_ew and carbonyl carbon (c, spec lines 28-30) typing."

  - name: "Acrolein (2-Propenal)"
    smiles: "C=CC=O"
    targets_gap:
      - "ce"  # CORRECTED 260820 -- see notes; was "cc/cd"
      - "c"  # Carbonyl carbon
    tier: "core"
    description: "α,β-unsaturated aldehyde. Terminal C=C conjugated with C=O. The terminal vinyl carbon (idx 0) types as c2; the internal vinyl carbon (idx 1, single-bonded to the carbonyl) types as ce; the carbonyl carbon (idx 2) types as c."
    notes: "CORRECTED 260820: the original claim (\"cc/cd conjugated
      carbons\") is wrong on two counts -- cc/cd is the *ring*-conjugation
      family (acrolein is acyclic), and only the internal vinyl carbon
      qualifies for ce at all; the terminal =CH2 carbon has no single-bonded
      heavy neighbor (same mechanism as 1,3-Butadiene/Divinyl-ketone) and
      falls through to c2. Verified via live run: idx0=c2, idx1=ce, idx2=c,
      idx3=o."

  - name: "Thiophene"
    smiles: "c1ccsc1"
    targets_gap:
      - "cc/cd"  # 5-membered heteroaromatic ring carbons are the cc/cd
                 # conjugated-ring family (AR2/AR3), not ca (AR1)
    tier: "core"
    description: "Aromatic 5-membered heterocycle with sulfur. Tests aromatic carbon typing in non-6-membered rings and heteroatom interaction with aromatic system."
    notes: "FIXED 260820: now resolves to cc (all 4 ring carbons), confirmed
      against a real external reference (antechamber/openmmforcefields
      GAFFTemplateGenerator, gaff-2.11 -- see
      scripts/validation/gaff2_external_reference.py). The fix: AR1 ('pure
      aromatic atom (such as benzene and pyridine)' per the DEF footer) now
      requires membership in a 6-membered aromatic ring; AR2/AR3 covers
      everything aromatic that isn't. KNOWN REMAINING GAP: real GAFF2
      alternates cc/cd around the ring for torsion-parameter bookkeeping
      (antechamber gives cc,cc,cd,ss,cd, not uniform cc) -- there is no
      corresponding `cd` ATD rule anywhere in ATOMTYPE_GFF2.DEF (confirmed by
      grep), so this needs a separate ring-traversal alternation algorithm,
      not rule-matching. See Furan/Pyrrole entries and
      tests/test_gaff2_golden.py::test_atom_type_five_membered_heteroaromatics."

  - name: "Furan"
    smiles: "c1ccoc1"
    targets_gap:
      - "cc/cd"  # Same AR1/AR2/AR3 fix as thiophene, oxygen analog
    tier: "core"
    description: "Aromatic 5-membered heterocycle with oxygen. Added 260819
      alongside Thiophene/Pyrrole to exercise the cc/cd-vs-ca AR-class gap
      across all three common 5-membered heteroaromatics."
    notes: "See Thiophene's notes -- same fix and same remaining cc/cd-
      alternation gap apply; resolves to cc for all 4 ring carbons."

  - name: "Pyrrole"
    smiles: "c1cc[nH]c1"
    targets_gap:
      - "cc/cd"  # Same AR1/AR2/AR3 fix as thiophene/furan, N-H analog
    tier: "core"
    description: "Aromatic 5-membered heterocycle with N-H. Added 260819
      alongside Thiophene/Furan for the same reason."
    notes: "See Thiophene's notes -- same fix and same remaining cc/cd-
      alternation gap apply; resolves to cc for all 4 ring carbons (ring N
      resolves to na)."

  - name: "Anthracene"
    smiles: "c1ccc2cc3ccccc3cc2c1"
    targets_gap:
      - "ca"  # CORRECTED 260820: NOT cp -- see notes
      - "multi-ring"  # Three fused 6-membered rings (larger than naphthalene)
    tier: "core"
    description: "Three fused aromatic rings in linear arrangement (tricyclic). Tests bridgehead-exclusion typing in more complex multi-ring topology (larger than naphthalene) and stresses multi-wildcard ATD rules with 14 aromatic carbons arranged in a central ring with outer rings on each side."
    notes: "CORRECTED 260820: previously claimed targets_gap: cp, but produces
      zero cp atoms. All 14 ring carbons resolve to ca, including the 4
      bridgeheads (idx 3, 5, 10, 12) -- same mechanism as Naphthalene, and
      confirmed by this campaign's Phase 3 adversarial refutation: each
      bridgehead genuinely has 3 aromatic heavy neighbors (satisfying cp's f9
      pattern) but is a member of TWO six-rings simultaneously
      (ring_counts_by_size={6:2}), so it fails cp's exact '1RG6' token, same
      as Naphthalene's bridgeheads. Largest aromatic fused system in this
      tier; maximum test of multi-ring topology complexity. See
      tests/test_gaff2_golden.py::test_naphthalene_bridgehead_confirmed_by_external_reference's
      docstring -- the 1RG6-exact-count reading is now confirmed against a
      real reference, and that confirmation applies equally here."

# Supplement tier: real consumer molecules (260820)
# ==================================================
# Per the original cross-repo plan
# (demistify/.praxia/docs/specs/260818_scope-sequence-and-priority-for-gaff2-li.md),
# distinct from the Core tier above (curated to stress specific known gaps):
# real molecules already running through proxide in production, sourced
# directly from the two live consumers rather than hand-picked.
#
# 17-OHP is owned by biosensors (campaigns/*/config.json's
# parameterize_ligand.ligand block, confirmed byte-identical across ~17
# campaign configs) and run via naurmalade as the MD engine -- "biosensors'
# 17-OHP" and "naurmalade's live ligand set" turned out to be the SAME
# molecule, not two independent sources as the original plan assumed
# (naurmalade itself has no independent drug-like-ligand production set).
# Real additional diversity comes from naurmalade's own 9-molecule cosolvent-
# probe set (configs/sweet_vft_cosolv_config.json, run through the
# gaff2_espaloma pathway in production) -- amino-acid-sidechain-mimic
# fragments, not bound ligands, but real currently-running GAFF2-typed
# inputs with genuine chemical diversity this tier otherwise lacks (aromatic
# ring, imidazole, carboxylate/ammonium zwitterion-like groups).
#
# All types below verified via a live run of the code in this repo (260820,
# post AR1/AR2/AR3 fix + H-atom typing rework), not sourced from any
# external prediction.

  - name: "17-OHP"
    smiles: "C[C@]12CC[C@H]3[C@@H](CCC4=CC(=O)CC[C@@]43C)[C@@H]1CC[C@@H]2C(=O)CO"
    targets_gap:
      - "real-consumer"  # Production ligand, not a curated synthetic case
    tier: "supplement"
    description: "17-hydroxyprogesterone. biosensors' sole production ligand (resname OHP), parameterized via naurmalade's gaff2_espaloma pathway across ~17 fusion-protein MD campaigns. A steroid with a conjugated enone (cross-conjugated C=C-C=O in the A-ring), several cyclopentane/cyclohexane sp3 ring carbons (c5/c6), and a terminal primary alcohol/ketone side chain -- exercises real production-scale structural complexity none of the Core tier's smaller synthetic molecules cover."
    notes: "Source: biosensors/campaigns/*/config.json (SMILES identical across
      every campaign checked). Real run (260820) resolves to 24 heavy atoms:
      c3, c5, c6 (x6), c2, ce, c (x2, both carbonyls: enone + side-chain
      ketone), o (x2), c6 (x2 more), c3, c5 (x4), oh -- the A-ring enone's
      alpha,beta carbons correctly resolve to c2/ce (chain conjugation, same
      mechanism as this tier's Acrolein/Divinyl-ketone Core-tier cases), not
      a ring-conjugated family, since the enone is exocyclic to the steroid's
      saturated ring system."

  - name: "Phenylalanine-probe"
    smiles: "c1ccccc1"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "Benzene -- naurmalade's cosolvent-probe fragment mimicking phenylalanine's aromatic sidechain (configs/sweet_vft_cosolv_config.json, resname EHP). Same molecule as the Core tier's Benzene entry, included here for provenance (confirms a real production cosolvent input types identically to the curated case)."
    notes: "All 6 ring carbons resolve to ca, matching the Core-tier Benzene
      entry exactly."

  - name: "Tyrosine-probe"
    smiles: "c1ccccc1O"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "Phenol -- cosolvent-probe fragment mimicking tyrosine's aromatic sidechain (resname RYT)."
    notes: "All 6 ring carbons resolve to ca, hydroxyl O resolves to oh."

  - name: "Histidine-probe"
    smiles: "C1=CN=CN1"
    targets_gap:
      - "real-consumer"
      - "cc/cd"  # Independent confirmation the AR1/AR2/AR3 fix generalizes
                 # beyond the Core tier's furan/pyrrole/thiophene
    tier: "supplement"
    description: "Imidazole -- cosolvent-probe fragment mimicking histidine's aromatic sidechain (resname SIH). A 5-membered heteroaromatic with TWO ring nitrogens (one pyridine-like, one pyrrole-like) -- exercises the AR1/AR2/AR3 fix on a heteroaromatic pattern distinct from the Core tier's furan/pyrrole/thiophene (single heteroatom each)."
    notes: "Real run (260820) resolves ring carbons to cc (both), the
      pyridine-like N to nc, the pyrrole-like N-H to na -- confirms the
      AR1/AR2/AR3 fix (6 in ring_counts_by_size gates AR1) generalizes
      correctly to a two-heteroatom 5-membered ring, not just the
      single-heteroatom cases the Core tier happened to test."

  - name: "SerThr-probe"
    smiles: "CC(O)C"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "Isopropanol -- cosolvent-probe fragment mimicking serine/threonine's hydroxyl sidechains (resname STH)."
    notes: "All 3 carbons resolve to c3, hydroxyl O resolves to oh."

  - name: "AsnGln-probe"
    smiles: "CC(=O)N"
    targets_gap:
      - "real-consumer"
      - "h_ew"  # Second independent amide N-H case beyond the Core tier's
                # Formamide/N-methylacetamide
    tier: "supplement"
    description: "Acetamide -- cosolvent-probe fragment mimicking asparagine/glutamine's amide sidechains (resname AGN). A third, independent amide N-H case beyond the Core tier's Formamide/N-methylacetamide."
    notes: "Real run (260820): methyl C resolves to c3, carbonyl C to c,
      carbonyl O to o, amide N to nt (same family as Formamide's N).
      Confirms the 260820 H-typing fix's hn resolution (verified via
      TestHAtomTyping::test_formamide_h_stress_hn_and_h5) generalizes to
      this independently-sourced production molecule."

  - name: "IleLeu-probe"
    smiles: "CC(C)CC"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "Isopentane -- cosolvent-probe fragment mimicking isoleucine/leucine's branched aliphatic sidechains (resname UEL)."
    notes: "All 5 carbons resolve to c3 -- plain sp3 alkane, no gap stress;
      included for provenance/completeness of the real cosolvent set."

  - name: "AspGlu-probe"
    smiles: "CC(=O)[O-]"
    targets_gap:
      - "real-consumer"
      - "h_ew"  # Delocalized carboxylate anion -- the [2DL]-branch case the
                # Core tier's cs/c coverage never found a real molecule for
    tier: "supplement"
    description: "Acetate anion -- cosolvent-probe fragment mimicking aspartate/glutamate's carboxylate sidechains (resname NEG). A resonance-delocalized carboxylate; this project's DL (delocalized bond) convention treats aromatic bonds as delocalized but NOT isolated non-ring resonance systems like this one (a documented, deliberate simplification -- see _bond_category_facts's docstring), so this exercises that documented limitation on a real production molecule."
    notes: "Real run (260820): methyl C resolves to c3, carbonyl-family C to
      c, both O's to o (symmetric anion, RDKit's default Kekule structure
      picks one O as the formal double bond -- both resolve identically here
      since c's f8 disambiguation doesn't depend on which specific O is
      which). Confirms the c/cs f8 branches examined in
      TestGaff2Grammar::test_atomic_prop_matches_2dl_and_3sb_exact_counts
      are exercised correctly on the true production case they were
      motivated by, even though [2DL] itself doesn't fire (per this
      project's documented DL-detection simplification)."

  - name: "Arg-probe"
    smiles: "C(=[NH2+])(N)NC"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "N-methylguanidinium cation -- cosolvent-probe fragment mimicking arginine's guanidinium sidechain (resname GRA). A resonance-delocalized, charged nitrogen-rich fragment -- structurally distinct from anything in the Core tier."
    notes: "Real run (260820): central C resolves to cz (guanidinium-type sp2
      carbon, requires 3 N neighbors per its f9 pattern -- correctly fires
      here, unlike the pre-PR-26 ethene bug where cz incorrectly fired for a
      nitrogen-free molecule), the two NH2 nitrogens resolve to nv, the
      N-methyl nitrogen resolves to nu, methyl C resolves to c3."

  - name: "Lys-probe"
    smiles: "CC[NH3+]"
    targets_gap:
      - "real-consumer"
    tier: "supplement"
    description: "Ethylammonium cation -- cosolvent-probe fragment mimicking lysine's primary-amine sidechain (resname SYL)."
    notes: "Real run (260820): both carbons resolve to c3, the protonated
      amine N resolves to nz."
