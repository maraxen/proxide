# GAFF2 Benchmark Curation - Core Tier
# ====================================
#
# Curated set of 11 molecules targeting proxide's 4 known GAFF2 gaps, plus
# explicitly required bridgehead aromatic and cross-conjugated polyene coverage.
#
# Gap targets:
# 1. h_ew: Hydrogen in electron-withdrawing environment (amides, enolates)
# 2. cc/cd/ce/cf: Conjugated carbon systems (sp2 carbons in conjugation)
# 3. cp: Aromatic carbon (bridgehead in fused aromatic systems)
# 4. Multi-ring: Complex multi-ring systems stressing multi-wildcard ATD rules
#
# Adversarial requirements (from pre-mortem review):
# - Bridgehead aromatic: An aromatic carbon in a bicyclic/fused system
# - Cross-conjugated polyene: Multiple C=C bonds not in direct conjugation
#
# Reference: audit findings in tests/test_gaff2_golden.py (commit 7e05237)
# Atom types verified against src/proxide/assets/gaff/dat/ATOMTYPE_GFF2.DEF

molecules:
  - name: "Benzene"
    smiles: "c1ccccc1"
    targets_gap:
      - "ca"  # Baseline aromatic carbon (ca per spec line 35: pure aromatic, no
              # neighbor-count constraint)
    tier: "core"
    description: "Simple aromatic baseline. All carbons should be typed as ca."
    notes: "CORRECTED 260819: previously documented as 'all cp', which was
      itself downstream of a confirmed parser bug (cp's required '3 aromatic
      neighbors' constraint was silently unenforced, so cp matched on ring
      size alone before ca ever got a chance). cp (spec line 33) additionally
      requires 3 aromatic heavy neighbors -- a fused-ring-junction pattern
      benzene's 2-aromatic-neighbor ring carbons don't have. See Biphenyl for
      a molecule that actually exercises real cp carbons."

  - name: "Toluene"
    smiles: "Cc1ccccc1"
    targets_gap:
      - "ca"  # Monosubstituted aromatic ring -- ipso carbon has one
              # non-aromatic (methyl) neighbor, so still fails cp's 3-aromatic-
              # neighbor requirement and correctly resolves to ca like the rest
    tier: "core"
    description: "Benzene with a single methyl substituent. All 6 ring carbons
      (including the ipso carbon attached to the methyl group) should be ca,
      not cp -- the ipso carbon has only 2 aromatic heavy neighbors plus one
      non-aromatic substituent."
    notes: "Added 260819 specifically to exercise the monosubstituted-ring
      case (as opposed to the unsubstituted-ring Benzene case above) that
      first surfaced the cp/ca bracket-pattern parsing bug."

  - name: "Naphthalene"
    smiles: "c1ccc2ccccc2c1"
    targets_gap:
      - "cp"  # BRIDGEHEAD AROMATIC - aromatic carbons at ring junction
      - "multi-ring"  # Two fused 6-membered rings (multi-wildcard ATD stress test)
    tier: "core"
    description: "Fused two-ring aromatic system. Tests bridgehead aromatic carbons (cp at the 4,5 fusion point) and multi-ring topology complexity."
    notes: "Naphthalene's bridgehead carbons (positions 4a and 8a) are aromatic and bonded to other aromatic carbons in a fused system. Note: The fusion carbons belong to TWO six-membered rings simultaneously, which may not strictly satisfy specs defining cp as requiring membership in exactly ONE six-membered ring (see biphenyl for comparison). RESOLVED (as a documented reading, not a verified answer) 260819: this implementation treats cp's '1RG6' token as an exact ring count, so bridgeheads (2 six-rings) are excluded from cp -- all 10 naphthalene ring carbons, bridgeheads included, currently resolve to ca. See tests/test_gaff2_golden.py::test_naphthalene_bridgehead_is_documented_ambiguity, which locks in this behavior while flagging it as needing real external verification (antechamber/OpenFF) before being treated as ground truth."

  - name: "Biphenyl"
    smiles: "c1ccc(-c2ccccc2)cc1"
    targets_gap:
      - "cp"  # The 2 ipso/connector carbons genuinely have 3 aromatic heavy
              # neighbors (2 ring + 1 cross-ring) and should be cp; the other
              # 10 ring carbons have only 2 aromatic neighbors and are ca
    tier: "core"
    description: "Two separate benzene rings connected by a single C-C bond. The
      two ipso carbons (one per ring, at the connection point) should be cp;
      the remaining 10 ring carbons should be ca."
    notes: "CORRECTED 260819: previously documented as 'pure cp carbons', which
      was wrong for the same reason as Benzene above -- only the 2 carbons
      that are genuinely bonded to 3 aromatic heavy neighbors (the ring-ring
      connection points) satisfy cp's real neighbor-count requirement."

  - name: "Indene"
    smiles: "C1C=Cc2ccccc21"
    targets_gap:
      - "cp"  # Aromatic carbons in 6-membered ring
      - "multi-ring"  # Fused 5+6 rings
    tier: "core"
    description: "Bicyclic with fused 5-membered and 6-membered aromatic rings. The 5-membered ring contains one sp3 methylene (C1) and two sp2 carbons (C=C), fused to the aromatic 6-membered ring. Tests aromatic carbon typing in different ring contexts and multi-ring topology."

  - name: "1,3-Butadiene"
    smiles: "C=CC=C"
    targets_gap:
      - "cc/cd"  # Conjugated sp2 carbons (cc/cd gap per spec lines 37-58)
    tier: "core"
    description: "Classic conjugated diene. Terminal carbons will be typed as ce (sp2 in conjugated chain), internal carbons as cc. Tests conjugated sp2 carbon discrimination."
    notes: "Spec lines 37-58 define cc for ring conjugation, lines 60-64 define ce for chain conjugation; this molecule tests the ce typing."

  - name: "Divinyl ketone"
    smiles: "C=CC(=O)C=C"
    targets_gap:
      - "cross-conjugated"  # CROSS-CONJUGATED POLYENE - vinyl groups conjugated to central carbonyl
    tier: "core"
    description: "Two vinyl groups (C=C) conjugated to a central carbonyl carbon (C=O). Tests cross-conjugated system with branching at a central sp2 carbon. Carbons should type according to conjugation rules (ce or cc for vinyl, c for carbonyl)."
    notes: "Explicit adversarial requirement: genuine cross-conjugated polyene with two vinyl arms bonded to a common sp2 carbonyl center."

  - name: "Formamide"
    smiles: "NC=O"
    targets_gap:
      - "h_ew"  # Hydrogen on N in amide (electron-withdrawing C=O environment)
    tier: "core"
    description: "Primary amide (formamide). Tests h_ew: hydrogen on nitrogen bonded to carbonyl carbon. N should be n3 or similar; C should be c (carbonyl); critical hydrogen typing on N adjacent to C=O."
    notes: "Gap target: EW-counting for h on N in amide environments. This is the minimal amide test case."

  - name: "N-methylacetamide"
    smiles: "CC(=O)NC"
    targets_gap:
      - "h_ew"  # Secondary amide: H on N bonded to C=O
      - "c"  # Carbonyl carbon
    tier: "core"
    description: "Secondary amide. Tests h_ew with a methyl-substituted nitrogen and separate methyl on carbonyl. Stresses hydrogen typing in amide environment and carbonyl sp2 carbon (c type)."
    notes: "More complex amide variant testing both h_ew and carbonyl carbon (c, spec lines 28-30) typing."

  - name: "Acrolein (2-Propenal)"
    smiles: "C=CC=O"
    targets_gap:
      - "cc/cd"  # α,β-unsaturated carbonyl (conjugated sp2 system)
      - "c"  # Carbonyl carbon
    tier: "core"
    description: "α,β-unsaturated aldehyde. Terminal C=C conjugated with C=O. Tests both cc/cd conjugated carbons and carbonyl carbon (c) in an extended conjugated system."
    notes: "Combines conjugation gap (cc/cd/ce) with carbonyl gap; stresses sp2 carbon typing across conjugated system."

  - name: "Thiophene"
    smiles: "c1ccsc1"
    targets_gap:
      - "cc/cd"  # 5-membered heteroaromatic ring carbons are spec-intended to
                 # be the cc/cd conjugated-ring family (AR2/AR3), not ca (AR1)
    tier: "core"
    description: "Aromatic 5-membered heterocycle with sulfur. Tests aromatic carbon typing in non-6-membered rings and heteroatom interaction with aromatic system."
    notes: "KNOWN LIMITATION 260819: currently resolves to ca (all 4 ring
      carbons), not the cc/cd family, because this implementation cannot
      structurally distinguish AR1 (pure aromatic, e.g. benzene/pyridine) from
      AR2/AR3 (planar conjugated rings with alternating bonds, which 5-membered
      heteroaromatics like thiophene/furan/pyrrole are meant to be) -- the DEF
      file gives classification targets for AR1-AR5 but no algorithm to compute
      them. See Furan/Pyrrole entries and
      tests/test_gaff2_golden.py::test_atom_type_five_membered_heteroaromatics."

  - name: "Furan"
    smiles: "c1ccoc1"
    targets_gap:
      - "cc/cd"  # Same AR1/AR2/AR3 limitation as thiophene, oxygen analog
    tier: "core"
    description: "Aromatic 5-membered heterocycle with oxygen. Added 260819
      alongside Thiophene/Pyrrole to exercise the cc/cd-vs-ca AR-class gap
      across all three common 5-membered heteroaromatics."
    notes: "See Thiophene's notes -- same known AR1/AR2/AR3 classification
      limitation applies; currently resolves to ca for all 4 ring carbons."

  - name: "Pyrrole"
    smiles: "c1cc[nH]c1"
    targets_gap:
      - "cc/cd"  # Same AR1/AR2/AR3 limitation as thiophene/furan, N-H analog
    tier: "core"
    description: "Aromatic 5-membered heterocycle with N-H. Added 260819
      alongside Thiophene/Furan for the same reason."
    notes: "See Thiophene's notes -- same known AR1/AR2/AR3 classification
      limitation applies; currently resolves to ca for all 4 ring carbons
      (ring N resolves to na)."

  - name: "Anthracene"
    smiles: "c1ccc2cc3ccccc3cc2c1"
    targets_gap:
      - "cp"  # Aromatic carbons in central ring
      - "multi-ring"  # Three fused 6-membered rings (larger than naphthalene)
    tier: "core"
    description: "Three fused aromatic rings in linear arrangement (tricyclic). Tests cp typing in more complex multi-ring topology (larger than naphthalene) and stresses multi-wildcard ATD rules with 14 aromatic carbons arranged in a central ring with outer rings on each side."
    notes: "Largest aromatic fused system in this tier; maximum test of multi-ring topology complexity. Distinct from naphthalene (bicyclic) in both structure and size."

