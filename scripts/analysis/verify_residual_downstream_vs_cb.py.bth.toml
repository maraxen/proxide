[experiment]
hypothesis = "θ=108.37° reduces CB distance to MASTER but increases terminal-atom distance"
rationale = "MASTER's downstream bond angles differ from proxide's CHARMM angles. If CB frame angle alone were the issue, both CB and terminals would improve/worsen together. Mixed results (CB better, terminals worse) would indicate the residual is downstream geometry, not CB angle."
measured_artifact = "per-residue CB and terminal-atom Euclidean distances in MASTER's canonical frame"

[outcomes.pass]
condition = "For ≥4 of {ARG, GLN, LYS, GLU, MET, LEU}: CB distance at θ=108.37° is SMALLER than at θ=113.5°, BUT terminal-atom distance is LARGER"
reasoning = "CB closer + terminals farther means CB knob alone cannot clear the drift gate; the residual is downstream geometry."
is_residual = true

[outcomes.marginal]
condition = "Mixed pattern: some residues confirm, others refute (2–3 confirm out of 6)"
reasoning = "Inconclusive. Pattern could indicate heterogeneous geometry issues across residue types, or measurement noise."
is_residual = false

[outcomes.fail]
condition = "For ≥4 of {ARG, GLN, LYS, GLU, MET, LEU}: CB distance at θ=108.37° is SMALLER AND terminal distance is SMALLER (hypothesis refuted)"
reasoning = "If both improve at θ=108.37°, the CB angle is the primary lever. Conversely, if both worsen, neither angle helps."
is_residual = false

[result_schema]
per_residue = { residue_code = "string", cb_dist_pb113_A = "float", cb_dist_pb108_A = "float", terminal_mean_dist_pb113_A = "float", terminal_mean_dist_pb108_A = "float" }
per_residue.description = "Euclidean distance (Angstroms) from top-probability rotamer sidechain atoms to MASTER rotlib.bin in canonical frame"
conclusion = "string describing hypothesis outcome (CONFIRMED/REFUTED/MIXED)"

