 AND p95_contact_delta_multichain <= 0.05 AND max_contact_delta_multichain <= 0.35 AND max_one_sided_contact_degree_multichain <= 0.35 AND median_crowdedness_delta_1crn <= 0.035 AND p95_crowdedness_delta_1crn <= 0.15 AND max_crowdedness_delta_1crn <= 0.35 AND median_crowdedness_delta_1ubq <= 0.035 AND p95_crowdedness_delta_1ubq <= 0.15 AND max_crowdedness_delta_1ubq <= 0.35 AND median_crowdedness_delta_multichain <= 0.035 AND p95_crowdedness_delta_multichain <= 0.15 AND max_crowdedness_delta_multichain <= 0.5 AND median_freedom_delta_1crn <= 0.05 AND p95_freedom_delta_1crn <= 0.15 AND max_freedom_delta_1crn <= 0.35 AND median_freedom_delta_1ubq <= 0.05 AND p95_freedom_delta_1ubq <= 0.15 AND max_freedom_delta_1ubq <= 0.35 AND median_freedom_delta_multichain <= 0.05 AND p95_freedom_delta_multichain <= 0.15 AND max_freedom_delta_multichain <= 0.5 AND median_contact_delta_1crn_default <= 0.0001 AND median_contact_delta_1ubq_default <= 0.0001 AND median_freedom_delta_1crn_default <= 0.05 AND median_freedom_delta_1ubq_default <= 0.05)"
decision = "accept_clean_room_confind_v2"
reasoning = "All invariants hold, including the by-construction relationships among proxide's own arms and both flag-effect controls. Parity-mode deltas and one-sided degrees satisfy the tight bounds, and default-mode contact and freedom medians hold."
is_residual = false

