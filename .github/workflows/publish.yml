name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels (Full)
        uses: PyO3/maturin-action@v1
        env:
          # ring's ARM assembly checks for __ARM_ARCH in preprocessed .S files.
          # aarch64 cross toolchains may not emit it from -march alone, so define it explicitly.
          CFLAGS_aarch64_unknown_linux_gnu: '-march=armv8-a -D__ARM_ARCH=8'
          CXXFLAGS_aarch64_unknown_linux_gnu: '-march=armv8-a -D__ARM_ARCH=8'
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features full
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-wheels-macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels (Slim)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --features xtc
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  build-wheels-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels (Slim)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features xtc
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  verify-crates:
    name: Validate crate metadata
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Validate crate metadata (description, license, repository)
        # cargo metadata --no-deps resolves workspace inheritance locally without hitting
        # crates.io, so this works pre-publish. It catches missing required fields before
        # the irreversible cargo publish step.
        run: |
          set -e
          cargo metadata --no-deps --format-version 1 > /tmp/workspace-meta.json
          python3 -c "
import json, sys
required = ['name', 'version', 'description', 'license', 'repository']
excluded = {'proxide_py', 'proxide-wasm'}
data = json.load(open('/tmp/workspace-meta.json'))
errors = []
for pkg in data['packages']:
    name = pkg['name']
    if name in excluded:
        continue
    for field in required:
        val = pkg.get(field)
        if not val:
            errors.append(f'{name}: missing {field}')
if errors:
    [print('ERROR:', e) for e in errors]
    sys.exit(1)
print(f'OK: {len(data[\"packages\"]) - len(excluded)} publishable crates pass metadata check')
"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-crates]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Copy README into each crate directory
        run: |
          for crate in proxide-units proxide-core proxide-parallel-rt proxide-geometry \
                       proxide-gaff proxide-io proxide-rotlib proxide-frag \
                       proxide-physics proxide-confind proxide_rs proxide_fixer; do
            cp -n README.md crates/$crate/README.md
          done
      - name: Publish crates in topological order
        # proxide_py and proxide-wasm are intentionally absent: publish = false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          # Tier 1 — no internal deps
          cargo publish --allow-dirty -p proxide-units
          sleep 30
          cargo publish --allow-dirty -p proxide-core
          cargo publish --allow-dirty -p proxide-parallel-rt
          sleep 30
          # Tier 2
          cargo publish --allow-dirty -p proxide-geometry
          sleep 30
          # Tier 3 — gaff/io/rotlib/frag all depend on core + geometry
          cargo publish --allow-dirty -p proxide-gaff
          sleep 30
          cargo publish --allow-dirty -p proxide-io
          cargo publish --allow-dirty -p proxide-rotlib
          cargo publish --allow-dirty -p proxide-frag
          sleep 30
          # Tier 4
          cargo publish --allow-dirty -p proxide-physics
          cargo publish --allow-dirty -p proxide-confind
          sleep 30
          # Tier 5
          cargo publish --allow-dirty -p proxide_rs
          sleep 30
          # Tier 6
          cargo publish --allow-dirty -p proxide_fixer

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels-linux, build-wheels-macos, build-wheels-windows, build-sdist]
    environment: pypi
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
