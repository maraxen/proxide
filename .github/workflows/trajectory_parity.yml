name: Trajectory Parity Tests

on: [push, pull_request]

jobs:
  trajectory-parity:
    name: trajectory-parity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Create virtual environment
        run: uv venv

      # Builds and installs the Rust extension as proxide._proxider (crate
      # default features = "full"). Rebuild locally from the REPO ROOT only:
      # `maturin develop --release`. Running maturin from crates/proxide_py
      # builds a top-level `_proxider` decoy that `import proxide` never loads
      # (#15); tests/test_extension_build_location.py fails if one exists.
      - name: Install dependencies and build Rust extension
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev,trajectories]"

      - name: Fetch test data
        run: |
          source .venv/bin/activate
          python scripts/fetch_test_data.py

      - name: Run parity tests
        run: |
          source .venv/bin/activate
          # Use -k to select specific trajectory tests if needed, or run all validation
          pytest -rs -v tests/validation/test_trajectory_parity.py \
            tests/validation/test_xtc_reader_parity.py \
            tests/validation/test_xtc_distogram_parity.py \
            tests/io/parsing/test_hdf5_integration.py \
            tests/io/parsing/test_mdtraj.py \
            tests/io/parsing/test_dispatch.py \
            tests/io/streaming/test_mdcath.py \
            tests/io/streaming/test_mdcath_extended.py
