name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Type check with Ty
        run: |
          source .venv/bin/activate
          ty check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Run Smoke Tests
        run: |
          source .venv/bin/activate
          pytest -m smoke
      - name: Run All Tests
        run: |
          source .venv/bin/activate
          pytest

  rust-checks:
    runs-on: ubuntu-latest
    env:
      # HDF5's file-open path takes a POSIX advisory lock by default; under
      # cargo test's default parallel test threads, two `hdf5::File::create`
      # calls (even against distinct tempdir paths) can race and fail with
      # "unable to lock file, errno = 11". This disables that locking, which
      # single-process test runs don't need. Verified locally: without it,
      # mdcath_h5/mdtraj_h5 tests fail intermittently; with it, 5/5 clean runs.
      HDF5_USE_FILE_LOCKING: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Install protoc (required by proxide-rotlib prost-build)
        run: sudo apt-get install -y protobuf-compiler
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Feature Powerset Check (Native)
        run: cargo hack check --feature-powerset
      - name: WASM Compatibility Check
        # proxide_py binds CPython via PyO3 (pyo3-ffi needs libc types that
        # don't exist on wasm32-unknown-unknown) and was never meant to be
        # wasm-compatible; exclude it from this check.
        run: cargo hack check --target wasm32-unknown-unknown --no-default-features --exclude proxide_py
      - name: Set up Python (for numpy, used by xtc_tests' MDA fixture)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: pip install numpy
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Run Serial Fallback Tests
        run: cargo test --workspace --no-default-features
      - name: Verify Benchmarks Compile
        run: cargo bench --workspace --no-run

  # Espaloma JAX charges ([espaloma] extra uses expaloma from PyPI).
  test-espaloma:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install with espaloma extra
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev,espaloma]"
      - name: Run Espaloma-marked tests
        run: |
          source .venv/bin/activate
          pytest -m espaloma tests/chem/test_partial_charges.py -v
