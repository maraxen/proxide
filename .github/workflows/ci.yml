name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Type check with Ty
        run: |
          source .venv/bin/activate
          ty check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Run Smoke Tests
        run: |
          source .venv/bin/activate
          pytest -m smoke
      - name: Run All Tests
        run: |
          source .venv/bin/activate
          pytest

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Feature Powerset Check (Native)
        run: cargo hack --feature-powerset --check
      - name: WASM Compatibility Check
        run: cargo hack --target wasm32-unknown-unknown --no-default-features check
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Run Serial Fallback Tests
        run: cargo test --workspace --no-default-features

  # Espaloma JAX charges ([espaloma] extra uses expaloma from PyPI).
  test-espaloma:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install with espaloma extra
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev,espaloma]"
      - name: Run Espaloma-marked tests
        run: |
          source .venv/bin/activate
          pytest -m espaloma tests/chem/test_partial_charges.py -v
