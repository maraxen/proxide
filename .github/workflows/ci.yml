name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Type check with Ty
        run: |
          source .venv/bin/activate
          ty check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Run Smoke Tests
        run: |
          source .venv/bin/activate
          pytest -m smoke
      - name: Run All Tests
        run: |
          source .venv/bin/activate
          pytest

  # Espaloma JAX charges ([espaloma] extra uses expaloma from PyPI).
  test-espaloma:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install with espaloma extra
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev,espaloma]"
      - name: Run Espaloma-marked tests
        run: |
          source .venv/bin/activate
          pytest -m espaloma tests/chem/test_partial_charges.py -v
