name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev]
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Type check with Ty
        run: |
          source .venv/bin/activate
          ty check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Fetch AmberTools/antechamber assets (not vendored in git)
        # Runs BEFORE install so the DEF is present on disk when `uv pip
        # install .[dev]` (non-editable) builds the wheel -- maturin's
        # `include = ["src/proxide/**/*"]` only packages what already
        # exists at build time; fetching after install would leave the
        # installed wheel without the DEF regardless of what's on disk.
        run: |
          source .venv/bin/activate
          python scripts/fetch_amber_assets.py
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[dev,openmm]
      - name: Verify GAFF2 rules load from the installed package
        # Fail-loud smoke gate for debt #1896: confirms the packaged DEF
        # round-tripped through the (non-editable) wheel build and loads
        # via the same PROXIDE_GAFF2_DEF-aware path gaff2.py's real callers
        # use -- not just that the file exists on the checkout's disk.
        run: |
          source .venv/bin/activate
          python -c "from proxide.chem.gaff2 import load_gaff2_rules; r, _ = load_gaff2_rules(); assert r, 'no GAFF2 rules loaded'"
      - name: Run Smoke Tests
        run: |
          source .venv/bin/activate
          pytest -m smoke
      - name: Run All Tests
        run: |
          source .venv/bin/activate
          pytest

  rust-checks:
    runs-on: ubuntu-latest
    env:
      # HDF5's file-open path takes a POSIX advisory lock by default; under
      # cargo test's default parallel test threads, two `hdf5::File::create`
      # calls (even against distinct tempdir paths) can race and fail with
      # "unable to lock file, errno = 11". This disables that locking, which
      # single-process test runs don't need. Verified locally: without it,
      # mdcath_h5/mdtraj_h5 tests fail intermittently; with it, 5/5 clean runs.
      HDF5_USE_FILE_LOCKING: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AmberTools/antechamber assets (not vendored in git)
        # Kept as a raw curl+digest-verify step (rather than
        # scripts/fetch_amber_assets.py) because this job's Python setup
        # step runs late (only needed for numpy), well after the Rust steps
        # below that compile crates/proxide-gaff2 and need this file
        # present first. Ref + digest here MUST stay in sync with
        # scripts/fetch_amber_assets.py's ASSETS list -- see that script's
        # docstring for why this file is fetched, not committed.
        run: |
          mkdir -p src/proxide/assets/gaff/dat
          curl -sSL -o src/proxide/assets/gaff/dat/ATOMTYPE_GFF2.DEF \
            https://raw.githubusercontent.com/Amber-MD/AmberClassic/20e92d4b44e84cc0ca84bdf7f640eba0c1d1f2ed/dat/antechamber/ATOMTYPE_GFF2.DEF
          echo "7a076ac2e667ab87057befc7a5985be4cead83e01ff5d2d3dab9f1d65bff637e  src/proxide/assets/gaff/dat/ATOMTYPE_GFF2.DEF" | sha256sum -c -
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by proxide-rotlib prost-build)
        run: sudo apt-get install -y protobuf-compiler
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Feature Powerset Check (Native)
        run: cargo hack check --feature-powerset
      - name: WASM Compatibility Check
        # proxide_py binds CPython via PyO3 (pyo3-ffi needs libc types that
        # don't exist on wasm32-unknown-unknown) and was never meant to be
        # wasm-compatible; exclude it from this check.
        run: cargo hack check --target wasm32-unknown-unknown --no-default-features --exclude proxide_py
      - name: Set up Python (for numpy, used by xtc_tests' MDA fixture)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: pip install numpy
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Run Serial Fallback Tests
        run: cargo test --workspace --no-default-features
      - name: Verify Benchmarks Compile
        run: cargo bench --workspace --no-run

  # Espaloma JAX charges ([espaloma] extra uses expaloma from PyPI).
  test-espaloma:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install with espaloma extra
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev,espaloma]"
      - name: Run Espaloma-marked tests
        # debt #1900: this job installs the [espaloma] extra specifically so
        # these tests run for real, not via pytest.importorskip's silent
        # skip path (which is what the plain `tests` job -- no rdkit/expaloma
        # installed -- correctly falls back to). A skip here means the extra
        # failed to import for some other reason and the test never actually
        # ran, which this job exists to catch -- so it must fail the build,
        # not just report green with a quiet asterisk.
        #
        # Mechanism: `set -o pipefail` makes the job fail on pytest's own
        # nonzero exit (a real failure, or exit code 5 for "no tests
        # collected" if -m espaloma matched nothing at all) same as before;
        # `-rs` is what buffers */reports the skip reasons/count into the
        # terminal summary; the trailing grep then fails the step on its own
        # if pytest itself exited 0 but the summary line still shows one or
        # more skips (e.g. an individual pytest.importorskip firing inside a
        # test that otherwise collected and "passed" as a skip). YAML-valid
        # multi-line `run:` block, no shell escaping surprises.
        run: |
          source .venv/bin/activate
          set -o pipefail
          pytest -m espaloma tests/chem/test_partial_charges.py tests/chem/test_gaff2_charges.py -v -rs \
            | tee pytest_espaloma.log
          if grep -qE '[0-9]+ skipped' pytest_espaloma.log; then
            echo "::error::Espaloma-marked tests were skipped in the test-espaloma job, which installs the [espaloma] extra specifically to run them for real. A skip here means expaloma/rdkit import failed silently instead of the extra actually being exercised -- failing the build instead of reporting a quiet green."
            exit 1
          fi
