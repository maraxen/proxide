[workspace]
resolver = "2"
members = [
    "crates/proxide_rs",
    "crates/proxide_py",
    "crates/proxide_fixer",
    "crates/proxide-core",
    "crates/proxide-geometry",
    "crates/proxide-physics",
    "crates/proxide-io",
    "crates/proxide-gaff",
    "crates/proxide-units",
    "crates/proxide-wasm",
    "crates/proxide-rotlib",
    "crates/proxide-confind",
    "crates/proxide-frag",
    "crates/proxide-parallel-rt",
    "crates/proxide-jaccard",
]

[workspace.package]
version = "0.1.0-alpha.11"
edition = "2021"
authors = ["Proxide Contributors"]
license = "MIT"
repository = "https://github.com/maraxen/proxide"
homepage = "https://github.com/maraxen/proxide"
readme = "README.md"

[workspace.dependencies]
approx = "0.5"
insta = { version = "1.39", features = ["glob"] }
proxide-core = { path = "crates/proxide-core", version = "0.1.0-alpha.11" }
proxide-geometry = { path = "crates/proxide-geometry", version = "0.1.0-alpha.11" }
proxide-physics = { path = "crates/proxide-physics", version = "0.1.0-alpha.11" }
proxide-io = { path = "crates/proxide-io", version = "0.1.0-alpha.11" }
proxide-gaff = { path = "crates/proxide-gaff", version = "0.1.0-alpha.11" }
proxide-units = { path = "crates/proxide-units", version = "0.1.0-alpha.11" }
proxide-rotlib = { path = "crates/proxide-rotlib", version = "0.1.0-alpha.11" }
proxide-confind = { path = "crates/proxide-confind", version = "0.1.0-alpha.11" }
proxide-parallel-rt = { path = "crates/proxide-parallel-rt", version = "0.1.0-alpha.11" }
proxide-jaccard = { path = "crates/proxide-jaccard", version = "0.1.0-alpha.11" }
proxide_rs = { path = "crates/proxide_rs", version = "0.1.0-alpha.11" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
nom = "7.1"
quick-xml = "0.31"
flate2 = "1.0"
memmap2 = "0.9"
orx-parallel = "2"
log = "0.4"
pyo3-log = "0.11"
thiserror = "1.0"
lazy_static = "1.4"
once_cell = "1.19"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
molly = "0.4.0"
hdf5 = { package = "hdf5-metno", version = "0.11", features = ["static"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
criterion = "0.5"
