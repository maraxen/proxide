[workspace]
resolver = "2"
members = [
    "crates/proxide_rs",
    "crates/proxide_py",
    "crates/proxide_fixer",
    "crates/proxide-core",
    "crates/proxide-geometry",
    "crates/proxide-physics",
    "crates/proxide-io",
    "crates/proxide-gaff",
    "crates/proxide-units",
    "crates/proxide-rotlib",
]

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2021"
authors = ["Proxide Contributors"]
license = "MIT"

[workspace.dependencies]
approx = "0.5"
insta = { version = "1.39", features = ["glob"] }
proxide-core = { path = "crates/proxide-core" }
proxide-geometry = { path = "crates/proxide-geometry" }
proxide-physics = { path = "crates/proxide-physics" }
proxide-io = { path = "crates/proxide-io" }
proxide-gaff = { path = "crates/proxide-gaff" }
proxide-units = { path = "crates/proxide-units" }
proxide-rotlib = { path = "crates/proxide-rotlib" }
proxide_rs = { path = "crates/proxide_rs" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
nom = "7.1"
quick-xml = "0.31"
flate2 = "1.0"
memmap2 = "0.9"
rayon = "1.10"
log = "0.4"
pyo3-log = "0.11"
thiserror = "1.0"
lazy_static = "1.4"
once_cell = "1.19"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
molly = "0.4.0"
hdf5 = { package = "hdf5-metno", version = "0.11", features = ["static"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
