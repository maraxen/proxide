[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "proxide"
version = "0.1.0a16"
description = "Protein I/O for JAX with high-performance Rust backend"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marielle Russo", email = "67157875+maraxen@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    # jax>=0.11 relocated jax._src.core.mutable_array/MutableArray and dropped the
    # experimental hijax.MutableHiType flax.nnx expects -- every published flax
    # release (through 0.12.8, as of 260818) breaks against jax 0.11.x. Pin <0.11
    # until flax catches up; verified 0.10.0-0.10.2 all work with flax 0.12.1/0.12.8.
    "jax<0.11",
    "numpy",
    "hydride",
    "grain",
    "jax-md",
    "msgpack",
    "msgpack-numpy",
    "equinox",
    "jaxtyping",
    "array_record",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
proxide = "proxide.cli:app"

[project.urls]
Homepage = "https://github.com/maraxen/proxide"
Repository = "https://github.com/maraxen/proxide"
Issues = "https://github.com/maraxen/proxide/issues"

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
tpu = ["jax[tpu]"]
cpu = ["jax"]
ml = [
    "huggingface_hub",
    "optax",
]
molecules = [
    "rdkit",
    # "openff-toolkit", # TODO: Fix resolution on Python 3.13/Linux
]
# JAX/Equinox partial charges (bundled weights; no PyTorch/DGL at inference).
# Private repo: use SSH or authenticate HTTPS (see README) when installing from CI.
espaloma = [
    "expaloma>=0.1.0",
    "rdkit",
]
# Legacy OpenFF Toolkit wrapper (still uses upstream espaloma_charge).
espaloma-openff = [
    "espaloma_charge>=0.0.8",
]
trajectories = [
    "mdtraj",
    "h5py",
    "biotite",
    "tables",
]
foldcomp = [
    "foldcomp",
]
openmm = [
    "openmm",
    # "openmmforcefields", # TODO: Fix resolution
]
# `ty` is exact-pinned (kept in sync with [dependency-groups].dev below) because
# CI's `uv pip install .[dev]` ignores uv.lock and always resolves the latest
# PyPI release — while local `uv run`/`uv sync` used the locked version. That
# split let the two environments silently diverge onto different ty releases
# with different diagnostics, which is the actual root cause behind this
# file's several "flips between real error and unused ignore" override
# comments below. Bump both pins together and re-verify diagnostics when
# upgrading.
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "ty==0.0.65",
    "chex",
    "sphinx",
    "sphinx-book-theme",
    "myst-nb",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "sphinxext-rediraffe",
    "maturin",
    "psutil",
    "matplotlib",
]

[tool.maturin]
# Path to the Rust crate
manifest-path = "crates/proxide_py/Cargo.toml"
# Python source directory
python-source = "src"
# The compiled Rust module name (import proxide._proxider)
module-name = "proxide._proxider"
# Include Python package files
include = [
    "src/proxide/**/*",
    "LICENSE",
]

[tool.pytest.ini_options]
markers = [
    "smoke: marks tests as smoke tests (fast and critical)",
    "espaloma: needs expaloma (JAX) + rdkit; run with pytest -m espaloma",
    "ligand_frame: needs proxide built with --features ligand-frame; run with pytest -m ligand_frame",
]

[tool.ruff]
line-length = 100
fix = true
indent-width = 2
force-exclude = true
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "tests",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["PD", "D203", "D213"]
pylint.max-args = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T201", "ANN201", "INP001", "PLC0415", "SLF001", "PLR2004", "ANN001", "D100", "D101", "D102", "D103"]
"tests/ops/test_processing.py" = ["E117", "S101", "T201", "ANN201", "INP001", "PLC0415", "SLF001", "PLR2004", "ANN001", "D100", "D101", "D102", "D103"]

[tool.ty.environment]
root = ["src/proxide"]

[tool.ty.src]
# None of these are part of the shippable package surface: tests/ is
# excluded from ruff for the same reason (see [tool.ruff]); scripts/ and
# benchmarks/ are one-off research/debug scripts (not installed, frequently
# import sibling scripts by bare name assuming a specific run context ty's
# static resolution can't follow, or use optional heavy deps not in the
# checked venv); docs/ is Sphinx configuration, not application code.
exclude = ["tests", "scripts", "benchmarks", "docs"]

[tool.ty.rules]
invalid-type-form = "ignore"

# openmm is an optional dependency (the "openmm" extra) so CI's minimal
# `.[dev]` install never has it, hence unresolved-import throughout this
# file's `try: from openmm import ... except ImportError:` guards. Its
# unit.Quantity/Unit system (mass * u.amu, cutoff * u.nanometer, etc.) also
# relies on __mul__/__rmul__ operator overloads and dynamically-set module
# attributes openmm's type stubs don't declare — verified at runtime that
# `openmm.unit.nanometer` and the multiplication both work correctly when
# openmm is installed; both gaps are stub/dependency completeness issues in
# openmm, not bugs here.
[[tool.ty.overrides]]
include = ["src/proxide/core/projector.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

# `Protein` (proxide.core.containers) is a flax.struct.dataclass whose
# coulomb14scale/lj14scale fields have `default=None` via
# struct.field(default=None, pytree_node=False) — ty doesn't recognize
# flax.struct's dataclass-transform the way it does stdlib dataclasses, so
# it sometimes treats these as required. Observed to flip between "real
# error" and "unused ignore comment" across separate `uv pip install .[dev]`
# runs (uv.lock isn't consulted by `uv pip install`, so exact transitive
# versions of flax/etc. aren't pinned) — a file-level rule override doesn't
# have an "unused" state the way an inline comment does, so it's robust to
# that drift where a per-line ignore isn't.
[[tool.ty.overrides]]
include = [
  "src/proxide/io/parsing/foldcomp.py",
  "src/proxide/io/parsing/utils.py",
  "src/proxide/io/streaming/array_record.py",
]

[tool.ty.overrides.rules]
missing-argument = "ignore"

# Same drift-sensitivity as above, for three more patterns:
# - __getitem__ overrides narrowing grain's RandomAccessDataSource base
#   signature (SupportsIndex -> Protein) — a deliberate, accepted narrowing.
# - biotite.structure.connect_via_residue_names/connect_via_distances —
#   real, standard biotite APIs (verified to exist and work at runtime);
#   whether ty can see them through biotite's compiled backend has varied
#   across separate dependency resolutions.
# - AtomArray/AtomArrayStack.__getitem__ with a `(slice, bool_mask)` tuple
#   key (e.g. `atom_array[:, chain_mask]`) — a standard biotite indexing
#   idiom (verified to work at runtime) that biotite's overload stubs don't
#   model correctly, so ty resolves the wrong overload arm and rejects the
#   boolean-mask argument.
[[tool.ty.overrides]]
include = [
  "src/proxide/ops/dataset.py",
  "src/proxide/io/streaming/array_record.py",
  "src/proxide/io/parsing/mdtraj.py",
  "src/proxide/io/streaming/mdcath.py",
  "src/proxide/io/parsing/utils.py",
]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-argument-type = "ignore"

# rdkit is an optional dependency (the "molecules"/"espaloma" extras) so
# CI's minimal `.[dev]` install never has it; expaloma (JAX charge model,
# "espaloma" extra) is likewise absent. Same drift-sensitivity as above —
# a per-line ignore on these rdkit/expaloma imports observably flips
# between "real error" and "unused ignore comment" across separate
# `uv pip install .[dev]` resolutions, so it's handled file-wide instead.
# unresolved-attribute follows from the same root cause: once the import
# is Unknown-typed, `Chem.Mol`/`Chem.X` attribute access on it would
# otherwise need its own per-line ignore. invalid-assignment covers the
# `except ImportError: Chem = None` / `from_rdkit_mol = None` fallback
# pattern — whether ty narrows the `if TYPE_CHECKING:` import to a
# concrete module/function type (making `= None` a real mismatch) or to
# Unknown (making it fine) has been observed to depend on the exact
# resolved Python/dependency versions, not just whether rdkit is present.
[[tool.ty.overrides]]
include = [
  "src/proxide/chem/gaff2.py",
  "src/proxide/chem/partial_charges.py",
  "src/proxide/io/parsing/molecule.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "chex",
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
    "expaloma>=0.1.0",
    "openmm>=8.4.0.post2",
    "openmmforcefields>=0.15.1",
    "ruff>=0.14.8",
    "ty==0.0.65",
]

[tool.uv]
# No platform lock to allow cross-platform resolution
