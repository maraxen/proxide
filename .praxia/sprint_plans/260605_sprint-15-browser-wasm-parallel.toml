fixer_prompt = '''
task_id: 260605_browser-wasm-parallel | track: C | backlog: #1171

PREREQUISITE: Track B must have PASS verdict before starting.

## Goal
Create the proxide-parallel-rt workspace crate: a minimal AtomicUsize thread-count registry.
No external dependencies.

## Files to create

### crates/proxide-parallel-rt/Cargo.toml
```toml
[package]
name = "proxide-parallel-rt"
edition.workspace = true
version.workspace = true
description = "Minimal parallel runtime: thread-count registry for wasm32 builds"
```

### crates/proxide-parallel-rt/src/lib.rs
```rust
use std::sync::atomic::{AtomicUsize, Ordering};

static NUM_THREADS: AtomicUsize = AtomicUsize::new(1);

pub fn set_num_threads(n: usize) {
    NUM_THREADS.store(n.max(1), Ordering::Relaxed);
}

pub fn num_threads() -> usize {
    NUM_THREADS.load(Ordering::Relaxed)
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn default_is_one() {
        assert_eq!(num_threads(), 1);
    }

    #[test]
    fn set_and_get() {
        set_num_threads(4);
        assert_eq!(num_threads(), 4);
        set_num_threads(1);
    }

    #[test]
    fn zero_clamps_to_one() {
        set_num_threads(0);
        assert_eq!(num_threads(), 1);
        set_num_threads(1);
    }
}
```

## Workspace registration
In root Cargo.toml, add "crates/proxide-parallel-rt" to the members array.

## Acceptance criteria
1. cargo build -p proxide-parallel-rt exits 0
2. cargo test -p proxide-parallel-rt -- --test-threads=1 exits 0 (3 tests pass)
3. cargo check --target wasm32-unknown-unknown -p proxide-parallel-rt exits 0
4. cargo test --workspace exits 0 (no regressions)
'''
