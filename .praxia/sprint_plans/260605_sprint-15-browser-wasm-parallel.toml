task_id: 260605_browser-wasm-parallel | track: A | backlog: #1176

## Goal
Narrow all 10 wasm32 parallel gates from `target_arch = "wasm32"` to
`all(target_arch = "wasm32", target_os = "unknown")`. This ensures wasm32-wasip1-threads
builds use full std::thread parallelism rather than the browser-specific num_threads injection.
Independent quick win — does not require the spike or the new crate.

## Why
`target_os = "unknown"` is the browser target. WASI targets set target_os to "wasi" —
the narrower gate correctly excludes them.

## All 10 sites (grep first, then change)
Run: grep -rn 'num_threads(1)' crates/ to find all sites. The files are:
  crates/proxide-confind/src/confind.rs
  crates/proxide-confind/src/parallel.rs
  crates/proxide-io/src/formatters/full.rs
  crates/proxide-io/src/formats/fasta.rs
