[sprint]
sprint_id = "260605_sprint-15-browser-wasm-parallel"
sprint_num = 15
name = "sprint-15-browser-wasm-parallel"
description = "Browser WASM parallelism for proxide: WASI gate narrowing (quick win), spike to validate std::thread::scope on wasm32+atomics, then proxide-parallel-rt crate + build config + dep wiring + call-site updates + init_parallel JS exposure."
context = '''
Spec: .praxia/docs/specs/260605_browser-wasm-parallel.md
task_id: 260605_browser-wasm-parallel
Branch: worktree-orx-parallel-wasm (clean; 288 tests green)

MECHANISM SUMMARY:
orx-parallel 2.4.0 spawns via std::thread::scope internally. With nightly + build-std +
-C target-feature=+atomics,+bulk-memory, std is rebuilt so std::thread::scope uses
SharedArrayBuffer-backed Web Workers on wasm32-unknown-unknown. No rayon, no wasm-bindgen-rayon.

JS calls init_parallel(navigator.hardwareConcurrency) (synchronous) -> stores n in
proxide-parallel-rt AtomicUsize -> all par() sites call .num_threads(proxide_parallel_rt::num_threads()).

Track A (WASI narrowing) and Track B (spike) are independent and run concurrently.
Tracks C and D depend on B passing; they run concurrently after B.
Track E depends on C+D. Track F depends on A+E. Track G depends on C+F.
'''
max_fix_retries = 2

