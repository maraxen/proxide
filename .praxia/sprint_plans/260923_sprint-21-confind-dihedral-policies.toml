description = "Track D (debt #1890): per-dihedral computation from immediate neighbours (Mosaist getPhi/getPsi/getOmega) by default, never across a missing atom or a skipped non-protein residue; geometric chain breaks governed by ChainBreakPolicy {Bridge (default, Mosaist), Split}; today's missing-atom compaction kept as an opt-in library setting (MissingAtomPolicy::LegacyCompact)."
context = '''
task_id: 260922_autonomous-loop (loop iteration 4). Branch autoloop/260923-sprint-21 stacked on autoloop/260922-sprint-20 (PR #44). Base commit 316d1ab.
Owner decisions (260923, on debt #1890): Mosaist parity = Mosaist semantics; today's compaction stays configurable as an opt-in setting "if reasonable";
existing entry points default to Bridge; Split opt-in.
Revised after TWO Opus spec-challenger reviews (sprint-20 #10-#17; sprint-21 REVISE 8 MAJOR / 7 MINOR, all key facts verified by the orchestrator:
params.rs:48/60 contain 4.50/4.52 Mosaist propensity constants that a naive "4.5" grep would hit; coords.rs:69 skips non-protein residues).
Orchestrator rulings: LegacyCompact x Split -> Err (no silent substitution); PerDihedral never computes across a skipped non-protein residue; LegacyCompact
is library-only (extract path), documented as reproducing extract_f64_backbone output as of 316d1ab — not load_pdb_f64/CLI (that path reads f64 text
coordinates and carries debt #1885); other Mosaist divergences (ACE/NH2 caps, TER within a chain ID, file order vs sorted order) documented + filed as debt.
Out of scope: 9999.0 sentinel -> Option (#1897), cache.rs silent rotamer drop (#1898), omega sign vs Mosaist (new debt, bits unchanged).
Rules: CLAUDE.md fail-fast; never `git add -A`; RUSTC_WRAPPER="" for cargo; narrow test runs; do NOT modify precondition.rs `mod tests` (spec OBS-102) or params.rs.
'''
