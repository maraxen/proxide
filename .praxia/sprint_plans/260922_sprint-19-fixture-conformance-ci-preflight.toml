[[tracks.items]]
backlog_id = "2250+debt-1889"
phase_name = "Track T — fixture conformance (C1+C2) + loud loaders (#2250 re-scoped, debt #1889)"
fixer_prompt = '''
task_id: 260922_autonomous-loop

## Objective
proxide_fixer's committed PDB fixtures load loudly (never None / skip), and one cross-API conformance test pins exactly what C1
(ConFind precondition gate) and C2 (disulfide sanitizer) report for each fixture.

## Verified facts
- crates/proxide_fixer/tests/common/mod.rs:15-27 load_topology(name) -> Option<Topology>: None on missing file; parse Err(_) -> None.
- crates/proxide_fixer/tests/test_harness_smoke.rs asserts topology.is_some() for clean_small, disulfide_pair, missing_atoms, chain_break (4 of 6 fixtures).
- crates/proxide_fixer/src/repack.rs:1056-1070 load_test_topology: same None pattern; callers ~L1102, 1272, 1339, 1484, 1544, 1584 (all
  rotlib-gated first). load_rotlib ~L1073-1090 maps an existing-but-unloadable rotlib to None.
- proxide_io::formats::pdb::parse_pdb_from_reader silently drops malformed ATOM lines (debt #1883) -> a loader must cross-check atom counts.
- C1: proxide_confind::precondition::{check_preconditions, require_preconditions} (precondition.rs:97, 289) on ProteinBackbone.
  Build the backbone via proxide_confind::coords::extract_f64_backbone(&ProcessedStructure) (coords.rs:63) — NOT load_pdb_f64 (debt #1885).
  ProcessedStructure::from_raw (proxide-core/src/processing/residues.rs:87).
- C2: proxide_fixer::sanitizers::disulfide::DisulfideSanitizer::new(&mut Topology).run() -> Result<Vec<Disulfide>, DisulfideError>.
  `sanitizers` only exists with feature protonation|capping|stereo|disulfide (lib.rs:20-26); CI runs `cargo test --workspace --no-default-features` (ci.yml:134).
- ATOM/HETATM line counts: clean_small 15, disulfide_pair 12, missing_atoms 13, chain_break 20, truncated_sidechain 5, no_hydrogens 15.

## Steps
1. tests/common/mod.rs: add `#![allow(dead_code)]`. load_topology(name) -> Topology: panic naming the path if missing; panic with the
   parse error if parse fails; panic if the ATOM/HETATM line count of the file text != raw.num_atoms. Add load_processed(name) ->
   ProcessedStructure (same parse + count check, then from_raw, panic on Err) and load_backbone(name) -> ProteinBackbone =
   extract_f64_backbone(&load_processed(name)) (panic on Err). Update test_harness_smoke.rs to the non-Option API and add a test that
   read_dir's tests/data and loads EVERY *.pdb (assert the set is exactly the 6 fixtures).
2. repack.rs test module: load_test_topology -> Topology with the same panic/count behaviour; update all 6 callers; make load_rotlib panic
   when a candidate path exists but fails to load (absent rotlib may still skip — that is debt #1891, out of scope). Add one test that loads
   truncated_sidechain.pdb and asserts its residue/atom content WITHOUT needing rotlib, so the fixture half runs in CI.
3. New file crates/proxide_fixer/tests/test_fixture_conformance.rs (UNGATED, runs under --no-default-features) — C1 per fixture via
   check_preconditions(&load_backbone(f)), asserting EXACT results:
   - clean_small: 3 residues (ALA1, GLY2, SER3), no violations, require_preconditions Ok.
   - disulfide_pair: 2 residues (CYS1, CYS2), no violations, Ok.
   - missing_atoms: 3 residues; bb[1].c and bb[1].o are None; violations in order: (ResidueIndex 1, res_id 2, GLY, MissingBackboneAtom "C"),
     (1, UndefinedPhi), (1, UndefinedPsi); 3 errors 0 warnings; require_preconditions Err(PreconditionsFailed(3)).
     CANARY for debt #1890 (comment must cite it): bb[2].phi != 9999.0 and bb[2].is_cis_peptide == true — this pins the CURRENT bridging
     defect; when #1890 is fixed this assertion must be updated deliberately.
   - chain_break: 4 residues; exactly one warning (ResidueIndex 2, res_id 3, SER, ChainBreak) with |gap_to_next_ca - 8.466| < 0.01; 0 errors; Ok.
   - truncated_sidechain: 1 residue (LYS), no violations, Ok.
   VERIFY these values by running the test; if any differs from the above, do NOT change the assertion to match silently — report the
   actual value and your reading of why in the report.
   Also for every fixture: the ordered (chain, res_id, res_name) sequence from load_topology equals the one from load_backbone.
4. New file crates/proxide_fixer/tests/test_fixture_disulfide.rs with `#![cfg(feature = "disulfide")]` — C2:
   - disulfide_pair: exactly one Disulfide (chain_a "A", res_a 1, chain_b "A", res_b 2, |distance - 2.04| < 1e-3); both residues renamed "CYX".
     Comment: CYS2's CB-SG is 5.54 A, so this fixture only exercises the SG-SG criterion (ledger B2) — not proof of physically valid detection.
   - clean_small, missing_atoms, chain_break: first assert the fixture has 0 residues named CYS/CYH/CYM/CYX (so the zero is not vacuous), then Ok(vec![]) and names unchanged.
5. Run: `RUSTC_WRAPPER="" cargo test -p proxide_fixer --no-default-features --tests` and `RUSTC_WRAPPER="" cargo test -p proxide_fixer --features disulfide --tests`
   and `RUSTC_WRAPPER="" cargo test -p proxide_fixer --lib repack` and `cargo fmt -p proxide_fixer -- --check`. Logs to target/logs/trackT_*.log; paste test result lines.
6. Stage only the files you changed (named), commit:
   test(fixer): fixture conformance for C1/C2 and loud fixture loaders (#2250, debt #1889)
   <body: C3 split to #5239; missing_atoms canary pins debt #1890; loaders cross-check atom counts>
   Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
   Claude-Session: https://claude.ai/code/session_01SbXt9g5fCHS6EFnoubG2Ft
'''
reviewer_prompt = '''
task_id: 260922_autonomous-loop
## VERIFY (commands / line reads only)
1. Commit touches only crates/proxide_fixer/ (tests/, src/repack.rs test module).
2. No `-> Option<Topology>` loader, no `Err(_) => None`, and no fixture-load skip remain (rg in crates/proxide_fixer/tests and repack.rs); load_rotlib panics on an existing-but-unloadable path.
3. Loaders cross-check ATOM/HETATM line count vs num_atoms (read the code; then prove it: append a malformed ATOM line to a COPY of clean_small in a temp dir and call the loader logic via a scratch test or by reasoning from the code path — state which).
4. test_fixture_conformance.rs has no cfg gate and passes under `cargo test -p proxide_fixer --no-default-features --test test_fixture_conformance`; its assertions match the per-fixture table in the plan exactly (compare line by line); the #1890 canary cites the debt.
5. test_fixture_disulfide.rs is gated on feature disulfide and passes with `--features disulfide`; zero-CYS preconditions present.
6. The read_dir test asserts exactly the 6 fixtures; the rotlib-independent truncated_sidechain test exists and runs without ROTLIB_PATH.
7. `cargo test -p proxide_fixer --no-default-features --tests`, `--features disulfide --tests`, and `--lib repack` pass; `cargo fmt -p proxide_fixer -- --check` clean.
8. Independent control: change one expected value in test_fixture_conformance.rs (e.g. the chain_break gap to 9.0), confirm the test fails, restore, confirm `git diff --quiet`.
PASS = all 8. FAIL otherwise, cite item + evidence.
'''
return_key = "2250"

