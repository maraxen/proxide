   locked extras: `uv export --frozen --no-hashes --extra dev --extra molecules --extra trajectories --no-emit-project > target/preflight/req.txt`,
   `uv pip install --python target/preflight/venv -r target/preflight/req.txt`, then build/install proxide into it (`maturin develop` with
