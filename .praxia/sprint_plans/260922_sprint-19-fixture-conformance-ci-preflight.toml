name = "Sprint 19 — proxide_fixer fixture conformance + loud loaders; optional-dependency CI pre-flight"
description = "Track T (backlog #2250 re-scoped + debt #1889): cross-API fixture conformance test (C1 preconditions + C2 disulfide) with exact per-fixture assertions, loaders that fail loudly with an atom-count check, repack fixture loaders fixed. Track P (debt #909, phase 1 of 2): pre-flight — install the optional-dependency extras in a Python 3.11 env and run every optional-dep-gated test file, producing a triage report; no CI change yet."
context = '''
task_id: 260922_autonomous-loop  (loop iteration 2)
Base branch: autoloop/260922_autonomous-loop at f86ac3d (sprint 18 merged).
Plan revised after a TIER2 spec-challenger review (Opus): verdict REVISE, 2 FATAL + 11 MAJOR, all FATALs verified by the orchestrator.
Key consequences: (1) debt #909's guard cannot be keyed on importorskip (34+ skips use *_AVAILABLE skipif flags) and switching strict CI on
would enable ~60 never-run tests at once -> split: this sprint runs the pre-flight only; the module-keyed guard + D15 ledger + pinned
extras + CI change is a follow-up sprint built on the pre-flight data. (2) #2250's "C1+C2+C3 chain" is not a chain: C3 takes a rotlib
template (split to backlog #5239), C1/C2 have no production caller; T7 becomes a cross-API fixture conformance test. (3) confind
fill_dihedrals bridges gaps (debt #1890) — T7 CHARACTERISES current values with a canary; it does not fix them.
Rules: CLAUDE.md fail-fast; never `git add -A` (sandbox dotfiles in tree); RUSTC_WRAPPER="" for cargo; narrow test runs only.
'''
