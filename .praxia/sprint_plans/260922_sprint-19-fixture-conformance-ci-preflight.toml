- Locked versions (uv.lock): rdkit 2026.3.1, mdtraj 1.11.0, h5py 3.15.1, tables 3.10.2 — all have cp311 manylinux wheels.
- Gated files (from review): importorskip sites (rg "importorskip\(" tests) and flag sites (rg "_AVAILABLE|HAS_H5PY|HAS_MDTRAJ" tests), incl.
  tests/test_gaff2_golden.py, tests/test_gaff2_parity_invariants.py, tests/io/parsing/test_mdtraj.py, tests/io/parsing/test_hdf5_integration.py,
  tests/validation/test_{xtc_reader,trajectory,xtc_distogram,physics}_parity.py, tests/io/streaming/test_mdcath*.py, tests/io/parsing/test_molecule.py, tests/io/parsing/test_dispatch.py.

## Steps
