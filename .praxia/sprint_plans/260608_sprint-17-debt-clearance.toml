fixer_prompt = '''
task_id: 260608_sprint-17-debt-clearance

## Objective
Fix the two remaining `cargo clippy --workspace -- -D warnings` failures in proxide-frag.
Edit only — no Write on existing files.

## Confirmed violations

File: crates/proxide-frag/src/fragment.rs, lines 90–91
  lint: clippy::needless_range_loop
  90: for r in 0..N {
  91:     for at in 0..4 {
  92:         centered_coords[r][at][0] -= centroid[0];
  ...
  }
Both loop variables are used only as index expressions into `centered_coords`.

## Fix strategy
These loops operate on a generic const-parameter array Fragment<N> using [N][[4][3]] coords.
Because N is a const generic, iter_mut() over a const-generic array is not ergonomic.
The idiomatic fix is a targeted allow at the loop site:
  #[allow(clippy::needless_range_loop)]
  for r in 0..N { ... }
Add a brief inline comment explaining the const-generic constraint so future reviewers understand why this is deliberate.

## Success criteria
`cargo clippy -p proxide-frag -- -D warnings` exits 0.
crates/proxide-rotlib and crates/proxide-io/proxide-physics are unaffected (already clean).
'''
reviewer_prompt = '''
task_id: 260608_sprint-17-debt-clearance

## Objective
