2. Run: `cargo clippy --workspace -- -D warnings 2>&1 | grep "proxide-frag"` — no proxide-frag errors.
3. Run: `cargo test -p proxide-frag` — all tests pass.
4. Verify no #[allow] was placed higher than the loop site (not on fn or struct).

## Pass criterion
