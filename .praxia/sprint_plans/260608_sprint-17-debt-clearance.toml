task_id: 260608_sprint-17-debt-clearance

## Objective
Fix two clippy violations in ccd_parser.rs. Edit only — no Write on existing files.

## Confirmed violations

### Violation 1 — while_let_on_iterator
File: crates/proxide-rotlib/src/geometry/ccd_parser.rs, line 99
The tokenize() method has:
  while let Some(c) = chars.next() { match c { ... } }
where `chars` is a Peekable<Chars> from `line.chars().peekable()`.
Fix: convert to `for c in chars.by_ref() { match c { ... } }`.
The loop body (match arms for quote toggling, whitespace splitting, and char accumulation) is unchanged.

### Violation 2 — type_complexity
File: crates/proxide-rotlib/src/geometry/ccd_parser.rs, line 125
The parse_cif_file() function return type is:
  Result<(HashMap<(String, String), f32>, HashMap<(String, String, String), f32>), RotlibError>
Fix: introduce two file-private type aliases immediately above parse_cif_file:
  type BondMap = HashMap<(String, String), f32>;
  type AngleMap = HashMap<(String, String, String), f32>;
Then rewrite the signature as:
  fn parse_cif_file(path: &Path) -> Result<(BondMap, AngleMap), RotlibError>
The aliases must NOT be pub.

## Success criteria
`cargo clippy -p proxide-rotlib -- -D warnings` exits 0.
The tokenize() and parse_cif_file() functions behave identically (no logic change).
'''
