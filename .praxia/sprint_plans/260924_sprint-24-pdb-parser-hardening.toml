[sprint]
sprint_id = "260924_sprint-24-pdb-parser-hardening"
sprint_num = 24
name = "Sprint 24 — PDB fixed-column parser hardening: one shared field reader, no silent drops/zeros (debts #1776 #1883 #1885 #1886, OBS-105 option a)"
description = "Three hand-rolled PDB readers (proxide-io pdb.rs, confind coords.rs first pass, fixer loop_model.rs) silently drop, zero-fill, or panic on malformed input. Introduce one char-safe fixed-column field reader in proxide-io with a structured error, make pdb.rs fail loud per OBS-105(a), and route confind and fixer through it."
context = '''
task_id: 260922_autonomous-loop (loop iteration 7). Branch autoloop/260924-sprint-24 stacked on autoloop/260923-sprint-23 (PR #47).
Recon (sonnet, 260924) verified:
- proxide-io/src/formats/pdb.rs parse_atom_line L14: <54 bytes -> None -> atom dropped (L114-119, #1883); byte slices line[0..6],[6..11],[12..16],[76..78] (L19,31-40,62-68) panic on multibyte UTF-8 (#1776); parse_i32(...)? drops atom on bad serial/res_seq; occupancy/B unwrap_or(1.0/0.0) for blank AND malformed (L41-50); unparseable MODEL keeps previous model (L103-107).
- confind coords.rs L265-279 first pass re-slices columns with unwrap_or(0.0) coords, then aligns with proxide_io::parse_pdb_file by atom index (L282, L304-312) (#1885).
- proxide_fixer loop_model.rs L343-429 parse_loop_residues: .get() slicing but res_id/serial/coords unwrap_or(0/0.0) (#1886); own extract_element_from_name L407 duplicates proxide-core infer_element (ledger A5).
- IOParseError/CIFRegistry cfg(feature="ssbond") at proxide-io lib.rs:15-17,24-36; proxide-wasm depends on proxide-io default-features=false, features=["pdb"].
- Dependency graph: confind, fixer, tmalign, wasm all already depend on proxide-io -> a new proxide-io module adds no edge.
- No fixture contains hex/hybrid-36 serials, >99999 atoms, non-ASCII, malformed occupancy; no caller/test depends on silent drops (gap: not proven).
- pqr.rs res_seq unwrap_or(0) L46-51 and .ok()? line drop; mmcif.rs serial/res_seq unwrap_or(0) L207-214, row-length mismatch skip L82-84 -> OUT of scope, filed as new debts.
- No PROX- code registry in code (OBS-110 not implemented).
Spec: OBS-105 amended (option a) names tests formats::pdb::tests::test_malformed_occupancy_is_an_error and test_blank_occupancy_takes_documented_default and fixture tests/data/coercion/malformed_occupancy.pdb.
Rules: CLAUDE.md fail-fast / ledger A1-A6, B1-B9; never `git add -A`; RUSTC_WRAPPER="" for cargo; never write the main checkout or /home/marielle/projects/proxide/data; no whole-suite local runs.
'''
max_fix_retries = 1
worktree_shadow_mode = false
revision = '''
Revised after an Opus spec-challenger review (REVISE: 0 FATAL, 7 MAJOR, 7 MINOR; record 260924_loop_sprint24_coherence). Orchestrator-verified:
loop_model.rs:489-493 extract_element_from_name already strips digits then calls infer_element (obj 1 true -> do NOT naively replace; recon's A5 claim was wrong);
golden is crates/proxide-confind/tests/data/dihedral_golden_316d1ab.json; mosaist golden test #[ignore] at coords.rs:1090 (obj 5 true);
OpenMM pdbfile.py _formatIndex: beyond 10**places writes '%X' of (index - 10**places + 10*16**(places-1)) % 16**places -> residue 10000 = 'A000'
(letter-led, already an error under decision a), but the modulo wraps to decimal-looking values at residue >= 34576 / serial >= 755360 (obj 3's
'2710' example corrected; silent-merge risk real after wrap). Hex 'A000'-'A009' coincide with hybrid-36, diverge from 'A010'.
'''

[decisions]
a_serial_encoding = "RECOMMENDED: non-decimal serial or res_seq (OpenMM letter-led hex 'A000'.. or hybrid-36) -> hard PdbFieldError naming field/columns/raw text (today: silent atom drop). Debt: explicit hex/hybrid-36 decoding behind a named option. IMPACT: OpenMM-written PDBs with >9999 residues or >99999 atoms (solvated prolix systems) will now fail loudly instead of silently losing atoms."
b_scope = "RECOMMENDED: PDB readers only; PQR (res_seq unwrap_or(0), .ok()? drops) and mmCIF (serial/res_seq unwrap_or(0), row-length skip) filed as debts for sprint 25 on the same helper."
c_short_line = "RECOMMENDED: record type from line[0..6]; ATOM/HETATM shorter than 54 chars -> LineTooShort; a trailing field is read from the partial slice get(a..min(b,len)) and is blank only if that slice is empty/whitespace (a trimmed length-77 'N ' element is read, not ignored)."
d_residue_wrap = "RECOMMENDED: error when a (chain, res_seq, icode) key reappears non-contiguously within one chain and model (catches OpenMM hex wraparound and other collisions that would silently merge residues in ProcessedStructure::from_raw)."
e_nonfinite = "RECOMMENDED: nan/inf/infinity in any numeric field -> NonFinite hard error (Rust parse accepts them; CLAUDE.md forbids NaN-as-unknown)."
f_bytes = "RECOMMENDED: read lines as bytes (read_until newline); non-UTF-8/non-ASCII content in records proxide does not parse (REMARK, AUTHOR, ...) is accepted; ATOM/HETATM/MODEL require line[..min(len,78)].is_ascii() else NonAscii with line+column."
g_infer_element_digits = "RECOMMENDED: move leading-digit stripping into canonical proxide_core infer_element in its own commit with a corpus test (also fixes the latent '1HB' -> C bug at pdb.rs:68 when the element column is blank); loop_model's wrapper then becomes a direct call only if the corpus test proves equivalence."

