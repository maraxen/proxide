[[tracks.items]]
backlog_id = "debt-1900"
phase_name = "Track C — explicit, validated, recorded GAFF2 partial charges (debt #1900)"
fixer_prompt = '''
task_id: 260922_autonomous-loop
Facts: src/proxide/chem/gaff2.py:1795-1849 _get_espaloma_charges: hand-copied espaloma path (duplicates partial_charges.py:61-95 assign_espaloma_charges_rdkit(backend="rust"), which already raises ImportError with install hints) wrapped in `except Exception: pass`; Gasteiger fallback replaces inf/|q|>10 with 0.0 (NaN passes); any exception -> [0.0]*n. Only caller: parameterize_gaff_with_rdkit (~L1934); only in-repo callers of that are tests (test_gaff2.py, test_gaff2_golden.py). CI job test-espaloma (ci.yml:152-175) installs .[dev,espaloma] (rdkit + expaloma) but does not fetch the GAFF2 DEF. RDKit returns NaN Gasteiger charges for organometallics (e.g. CC[Zn]C). Precedent for provenance keys: crates/proxide_py/src/py_chemistry.rs:170-233 (every key always present); constant CHARGE_SOURCE_ESPALOMA_AM1BCC in src/proxide/chem/partial_charges.py:24.
Steps:
1. Replace _get_espaloma_charges with `_assign_gaff2_charges(mol, charge_method)`:
   - "espaloma" (DEFAULT): call assign_espaloma_charges_rdkit(..., backend="rust") from partial_charges.py; let its errors propagate (no except).
   - "gasteiger": rdkit.Chem.rdPartialCharges.ComputeGasteigerCharges(mol, throwOnParamFailure=True); then post-check every value is finite and |q| <= GASTEIGER_BLOWUP_GUARD (named module constant = 10.0, documented as a numerical blow-up guard, NOT a calibrated physical bound — say no finite |q|>10 case is known); violation -> ValueError naming atom index, element, value.
   - any other value -> ValueError. No "auto".
   - Validate the output of EVERY branch (finite, length == n_atoms) and the total: |sum(q) - sum(formal charges)| <= a small named tolerance, else ValueError (catches implicit-H input).
2. parameterize_gaff_with_rdkit(..., charge_method: str = "espaloma"): thread it through; the result dict ALWAYS includes "charges", "charge_method" (CHARGE_SOURCE_ESPALOMA_AM1BCC or a new sibling CHARGE_SOURCE_GASTEIGER in partial_charges.py). Fix the return docstring (~L1865-1871) to list charges and charge_method.
3. Tests: new tests/chem/test_gaff2_charges.py.
   - Pure tests (no rdkit needed, run in the main pytest job): the validator (NaN, inf, |q|>guard, wrong length, bad total) raises; dispatcher rejects unknown method.
   - @pytest.mark.espaloma tests (run in the test-espaloma job): espaloma charges for methanol (explicit H) are finite, not all zero, sum to formal charge; gasteiger charges for methanol equal RDKit reference [0.0319, -0.3996, 0.0527, 0.0527, 0.0527, 0.2096] within 1e-3 (regenerate the reference with RDKit if these differ and say so); CC[Zn]C with gasteiger raises; implicit-H methanol raises the total-charge check. These call the charge helper directly (the DEF is not fetched in that job).
   - Add the new file to the test-espaloma job's pytest command (ci.yml ~L175) and make that job fail on skips: add `-rs` and a check that the summary contains no "skipped" (or pass `-p no:skip`-equivalent; choose a robust mechanism and explain it).
4. tests/test_gaff2.py: convert every `return failed == 0` style test into real asserts (the file's own docstring L13-16 names this bug); charge tests assert not-all-zero and pass charge_method explicitly where they only care about typing.
5. Run: `uv run --no-project pytest tests/chem/test_gaff2_charges.py -q -rs` (espaloma-marked ones run locally since expaloma is installed), `uv run --no-project pytest tests/test_gaff2.py -q -rs` (DEF-dependent tests will raise Gaff2DefMissingError locally — report counts), ruff, ty on touched files.
Commit: fix(gaff2): explicit, validated, recorded partial-charge method; no silent fallback or zero fill (debt #1900)
'''
reviewer_prompt = '''
task_id: 260922_autonomous-loop
VERIFY: 1) diff limited to gaff2.py, partial_charges.py, tests/chem/test_gaff2_charges.py, tests/test_gaff2.py, .github/workflows/ci.yml; 2) `rg -n "except Exception|\[0\.0\] \*|= 0\.0$" src/proxide/chem/gaff2.py` shows no charge-path swallow/zero-fill; no duplicated espaloma code (calls assign_espaloma_charges_rdkit); 3) default charge_method == "espaloma"; no "auto"; 4) new test file passes locally with 0 unexpected skips; methanol Gasteiger reference asserted; CC[Zn]C raises; 5) independent control: make the validator accept NaN -> the NaN test fails; restore; 6) test_gaff2.py has no `return <bool>` tests left; 7) ci.yml test-espaloma runs the new file and fails on skips (read the mechanism; YAML parses); 8) ruff + ty clean on touched files. PASS = all 8.
'''
return_key = "debt-1900"

