description = "Track R (debt #1898): rotamer-library errors in ConFind propagate instead of silently dropping an amino acid. Track Y (debt #1901): remove three Python stubs that return fake empty results. Track C (debt #1900): GAFF2 partial charges never silently change model or fabricate values; the charge method is explicit and recorded."
context = '''
task_id: 260922_autonomous-loop (loop iteration 5). Branch autoloop/260923-sprint-22 stacked on autoloop/260923-sprint-21 (PR #45).
Revised after an Opus spec-challenger review (REVISE; FATAL #1 verified: the Dunbrack-derived .pb.zst rotlib has no ALA —
crates/proxide-rotlib/tests/test_converter_ac3.rs:97). Record: .praxia/spec_adversarial_reviews.jsonl (260923_loop_sprint22_coherence).
OWNER DECISIONS REQUIRED (see [decisions]); the plan below assumes the recommended answers.
Rules: CLAUDE.md fail-fast; never `git add -A`; RUSTC_WRAPPER="" for cargo; narrow runs; never create/fetch ATOMTYPE_GFF2.DEF.
'''
max_fix_retries = 1
worktree_shadow_mode = false

[decisions]
d1_track_r = "RECOMMENDED: land #1898 now. Consequence, stated deliberately: the confind CLI and any caller using the Dunbrack .pb.zst library will fail with RotlibError::UnknownAa(\"ALA\") until backlog #5244 adds an ALA entry. Today those runs silently omit ALA (propensity 7.73; permanent_contacts always empty). MASTER rotlib.bin has all 18 amino acids, so the Mosaist parity tests are unaffected. Alternative: hold #1898 until #5244 lands (keeps the silent omission meanwhile)."
d2_track_c = "RECOMMENDED: charge_method default = \"espaloma\" (strict); \"gasteiger\" explicit opt-in; no \"auto\". GAFF2 is parameterised for AM1-BCC-class charges; Gasteiger is a different model, not a lower-accuracy default. Alternative: keep an opt-in \"auto\" that falls back ONLY on ImportError or expaloma's unsupported-element ValueError, recording the reason."

