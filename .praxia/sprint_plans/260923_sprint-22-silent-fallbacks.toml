phase_name = "Track R — ConFind propagates rotamer-library errors (debt #1898)"
fixer_prompt = '''
task_id: 260922_autonomous-loop
Facts: crates/proxide-confind/src/cache.rs:116-122 maps any rotlib.num_rotamers error to rotamer_grids.insert(aa, None) + continue. ConFindError already has
`RotlibError(#[from] proxide_rotlib::RotlibError)` (error.rs:16-17); L132 uses .map_err(ConFindError::RotlibError). Mosaist errors on a missing amino acid
(mstrotlib.cpp:389-390). cache.rs:135 `rotamer_probability_by_id(&placed.id).unwrap_or(0.0)` (also cache.rs:38, parallel.rs:103,106) silently zeroes a weight.
Steps:
0. Record whether each data/rotlibs/*.pb.zst contains "ALA" (RotamerLibrary::load_pb + a contains/lookup call in a throwaway test or example — do not commit it); report the result.
1. cache.rs:116-122 -> `let nr = rotlib.num_rotamers(aa, phi, psi, rb.is_cis_peptide).map_err(ConFindError::RotlibError)?;`. Remove the None-insert skip; fix the cache.rs:12-14 doc so None has one meaning.
2. cache.rs:135 -> `?` (function returns Result); cache.rs:38 and parallel.rs:103,106 -> `.expect("RotamerId came from this library")` with a comment. No silent 0.0.
3. Test (plain `cargo test`, runs in CI, no env gate): build a synthetic MSL-format rotamer library INSIDE the test (confind tests cannot import rotlib's write_minimal_lib — copy the minimal format) with all 18 AA_NAMES except TRP; run ConFind on a small committed backbone (e.g. crates/proxide_fixer/tests/data/clean_small.pdb via extract_f64_backbone or tests/data/1crn.pdb) and assert `matches!(err, ConFindError::RotlibError(RotlibError::UnknownAa(a)) if a == "TRP")`; positive control: the same library with TRP added -> Ok.
4. Update the ignored drift test (crates/proxide-confind/tests/test_drift_loadpb_small_pdb.rs ~L83-110) so that with the Dunbrack .pb.zst it expects the UnknownAa("ALA") error (or skips with an explicit panic-message reason naming backlog #5244) instead of `.expect("contacts should succeed")`.
5. Run: `RUSTC_WRAPPER="" cargo test -p proxide-confind`, `cargo test -p proxide-confind -- --ignored` (report which pass/fail and why), fmt, `cargo clippy -p proxide-confind --lib -- -D warnings`.
Commit: fix(confind): propagate rotamer-library errors instead of dropping amino acids (debt #1898)
'''
reviewer_prompt = '''
task_id: 260922_autonomous-loop
VERIFY: 1) diff limited to crates/proxide-confind; 2) `rg -n "Err\(_\)|unwrap_or\(0\.0\)" crates/proxide-confind/src/cache.rs crates/proxide-confind/src/parallel.rs` shows no rotlib swallow; 3) the synthetic-library test runs under plain cargo test (not ignored), asserts UnknownAa("TRP") exactly, and has a passing positive control; 4) independent control: add TRP to the negative library -> test fails; restore; 5) existing parity tests with MASTER rotlib.bin still pass when run with --ignored (show they executed); 6) step-0 ALA result reported; drift test updated as planned; 7) fmt + clippy lib clean. PASS = all 7.
'''
