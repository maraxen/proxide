[decisions]
a_pqr_token_count = "RECOMMENDED: 11 tokens -> chain = token 4, res_seq = token 5 (no grammar test on the chain, so digit chains like '1' work). 10 tokens -> token 4 must match the res_seq grammar (else TokenCount) and chain = ''; if res_name (token 3) is longer than 3 characters on a 10-token line -> TokenCount 'merged columns (4-char residue name fused with chain); regenerate with pdb2pqr --whitespace' (stops CHARMM 'TIP3A 1' from silently becoming res_name TIP3A/chain ''). 12+ tokens -> TokenCount, a DELIBERATE change (today extras are ignored). A first token matching ^(ATOM|HETATM)[0-9]+$ -> TokenCount 'merged record/serial', never silently ignored."
b_pqr_res_seq = "RECOMMENDED: res_seq grammar -?[0-9]+ followed by at most one ASCII letter (insertion code); anything else ('A52', '', '5-2', '52AB') -> Unparseable naming res_seq. A chain merged with the number ('A1000') on a 10-token line therefore fails as TokenCount per decision a, not as a misleading res_seq error."
c_pqr_numbers = "RECOMMENDED: serial/x/y/z/charge/radius unparseable -> Unparseable, nan/inf -> NonFinite, naming the field (today: atom silently dropped). No range checks on charge/radius (0.0 radius is legitimate for some force-field hydrogens)."
d_cif_rows = "RECOMMENDED: (1) rows are LINE-ANCHORED: a row must end at a line end; when a line's tokens would push the pending row past N columns, or a completed row leaves tokens on the same line, raise RowLength naming THAT line (multiple rows per line are rejected though CIF allows them — RCSB/gemmi/Biopython never write them). A row may continue onto following lines only while it has fewer than N tokens. (2) A quote opens only at token start; an unterminated quote -> UnterminatedQuote. (3) Values carry whether they were quoted: quoted '.' / '?' are Present text. (4) ';' text fields are recognised only at column 1 of the UNTRIMMED line, and text-field scanning takes precedence over every line classifier ('#', 'loop_', tag lines). (5) Category = text before the first '.' of a tag, compared exactly to '_atom_site'. (6) 'loop_', 'data_', 'save_', 'global_', 'stop_' (case-insensitive) and any tag line are boundaries; a boundary or EOF with a row pending -> RowLength naming the row's start line and its token count."
e_cif_dot_question = "RECOMMENDED: CifValue {Present(&str), Inapplicable('.'), Unknown('?')}. REQUIRED fields (id, Cartn_x/y/z, atom id, comp id, asym id, seq id after decision f's fallback) error on Inapplicable or Unknown, naming which. OPTIONAL fields label_alt_id, pdbx_PDB_ins_code, type_symbol treat both as absent: RCSB writes '.' for alt_id and '?' for ins_code routinely; type_symbol absent -> infer_element as today. pdbx_formal_charge is NOT read (unchanged; charge stays None)."
f_cif_label_auth = "RECOMMENDED: for atom id, comp id and asym id choose the source PER COLUMN, once per loop header: label_* if the column exists, else auth_* if it exists, else required-field error. A '?' or '.' in a present label_* column is an error, never a per-row borrow from auth_* (mixing namespaces in one file would be A1/A2). seq id: label_seq_id, and ONLY when it is Inapplicable '.' (the RCSB HETATM/HOH case, today's behaviour) fall back per row to auth_seq_id; label_seq_id '?' -> Unknown error. Debt for whether proxide should prefer auth_* (PDB-compatible chains/numbering)."
g_cif_numbers_model = "RECOMMENDED: id / seq id unparseable -> Unparseable (today: unwrap_or(0)); Cartn unparseable -> Unparseable, nan/inf -> NonFinite (today: row dropped); pdbx_PDB_model_num present but unparseable, '.' or '?' -> InvalidModel (today: previous model silently kept); a label_alt_id longer than one character -> Unparseable (today: truncated)."
h_error_shape = "RECOMMENDED: new crates/proxide-io/src/formats/field_parse.rs holds format-neutral token helpers (parse_decimal_i32, parse_finite_f32/f64 on &str), used by pdb_fields.rs with unchanged behaviour, AND one shared TokenFieldErrorKind {Unparseable, NonFinite, InvalidModel, TokenCount, RowLength, UnterminatedQuote, Inapplicable, Unknown, NonLoopUnsupported, MultipleDataBlocks, BadGroup, Io}. PqrFieldError (line, token index, field, raw) and CifFieldError (row start line, column name, field, raw) both use it; both #[non_exhaustive], Error+Display incl. literal PROX-IO-MALFORMED-RECORD, raw truncated with '…(+N bytes)'. PdbFieldError/PdbFieldErrorKind are NOT changed. Public parse_pqr_file / parse_mmcif_file / parse_mmcif_from_reader keep returning Box<dyn Error>; tests downcast_ref."
i_real_files = "RECOMMENDED: add under crates/proxide-io/tests/data/ (not tests/data/, which test_structure_parity.py globs) real wwPDB files 1CRN.cif, 1CRN.pdb and 1UBQ.cif (1UBQ has HOH, exercising the '.' label_seq_id path) fetched from files.rcsb.org — an unsandboxed fetch of that host only is allowed; wwPDB data is CC0 1.0. Check in PROVENANCE.md with URL, retrieval date, sha256, CC0 note. Step 0 asserts for each real .cif status ok and num_atoms == an independent count of ATOM/HETATM rows in its _atom_site loop (and for 1CRN.pdb the ATOM/HETATM line count); a mismatch means the OLD parser drops rows -> STOP and report. 1CRN.cif vs 1CRN.pdb parity test: same atom count, names, and coordinates to the file precision. The 4-atom stub tests/data/1crn.pdb is NOT replaced."
j_rotlib_helper = "RECOMMENDED: parse_pdb_backbone panics naming line + field on unparseable res_seq/coords and propagates I/O errors (no .lines().flatten()); the (chain, res_seq) key gains the insertion code. Gate: a NEW non-ignored test with a checked-in 3-residue PDB snippet under crates/proxide-rotlib/tests/data/ plus #[should_panic(expected = ...)] variants for bad res_seq and bad x — because every existing caller is #[ignore]."
l_cif_occ_b_group = "RECOMMENDED (OBS-105 option a, spec line 996): occupancy / B_iso_or_equiv absent, '.' or '?' -> documented defaults 1.0 / 0.0; present but unparseable -> Unparseable; nan/inf -> NonFinite. group_PDB when present must be ATOM or HETATM else BadGroup; absent -> ATOM (today's behaviour). Every remaining unwrap_or / unwrap_or_default in mmcif.rs and pqr.rs outside #[cfg(test)] carries a `// documented-default:` comment on the same line (checked by rg)."
m_exclusions = "RECOMMENDED: non-loop `_atom_site.x value` form -> NonLoopUnsupported error; more than one data_ block containing _atom_site -> MultipleDataBlocks error. Explicitly OUT: ResidueReappears for PQR/mmCIF (debt), PQR MODEL records (ignored as today; debt), crates/proxide_rs/tests/fixtures/test.cif (unreferenced; left in place, included in the snapshot), ccd_parser.rs tokenizer + 1.5 Å / 109.5° silent fallbacks (debt), #1918, #1921, #1911."
n_debts = "RECOMMENDED: file (MCP debt tool) and report IDs for: Python PDB writer overflow (writing.py:154, backend.py:391); writing.py:149 atom_name[0] element fallback (A2); MOL2 charge 0.0 default (molecule.py:120); mmCIF label_* vs auth_* preference; ResidueReappears for PQR/mmCIF; PQR MODEL records; ccd_parser tokenizer + bond/angle silent defaults (physics — needs citation-backed fix)."

