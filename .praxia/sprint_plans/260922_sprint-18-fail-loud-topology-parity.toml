task_id: 260922_autonomous-loop

## Objective
The USalign sample-pair parity tests must run and assert in CI. A missing or unparseable fixture must FAIL the test, never report a bare pass.

## Verified facts
- /home/marielle/repos/USalign is at commit 177cc8a2bbd3e2a6e9c5faaaa4ff5dfa1e6048f7 and PDB1.pdb, PDB2.pdb, LICENSE are clean at that commit.
  sha256: PDB1.pdb 7fa7989c8221d9be7f1c40a5aa21c0e1481f0c1ac977df41d5cb82392760f5b2
          PDB2.pdb 879c407d45727910efad897a65773452f735fce8a7ceb48e14b20f4406e5c652
  LICENSE permits redistribution provided its notices, reference list and copyright notice accompany all copies.
- crates/proxide-tmalign/tests/common/mod.rs:12-24 `load_usalign_sample` -> Option; HOME/USALIGN_REPO lookup; `.ok()` on parse error.
- crates/proxide-tmalign/tests/test_parity_pdb1_pdb2.rs: three tests early-return on None (L54-58, L91-92, L124-128).
- crates/proxide-tmalign/src/structure.rs:105-140: a SECOND loader `usalign_sample` with the same skip-if-absent early return in two unit tests (PDB1 length 250, PDB2 length 166). Both copies must be fixed (ledger A5).
- crates/proxide-tmalign/tests/data/ already holds six curated fixtures used by test_parity_curated_set.rs.
- PDB1.pdb lines have no chain ID and blank B-factor columns; they parse today (occupancy/B-factor defaults are unchanged in this sprint).

## Steps
1. Copy the two files byte-for-byte: `cp /home/marielle/repos/USalign/PDB1.pdb /home/marielle/repos/USalign/PDB2.pdb crates/proxide-tmalign/tests/data/` and verify with `sha256sum` that both match the hashes above exactly. If either differs, STOP and report.
2. Write crates/proxide-tmalign/tests/data/NOTICE-USalign.md: source repo URL (https://github.com/pylelab/USalign), commit 177cc8a2bbd3e2a6e9c5faaaa4ff5dfa1e6048f7, both sha256 values, which files it covers, and USalign's LICENSE text copied VERBATIM from /home/marielle/repos/USalign/LICENSE.
3. Replace BOTH loaders with one behaviour: resolve `Path::new(env!("CARGO_MANIFEST_DIR")).join("tests/data").join(name)`; `panic!` with the path if the file is missing; `panic!` with the error if parsing fails (no `.ok()`); assert the file's sha256 equals the pinned value (add `sha2` as a dev-dependency only if it is not already in the workspace — check Cargo.lock first; if adding a dependency is needed, prefer a hand-rolled comparison of the byte length + a cheap checksum and report the choice). Remove the HOME/USALIGN_REPO lookup; the reference constants were captured against 177cc8a, so an override that swaps fixtures would silently invalidate them.
4. Remove every `let Some(..) = .. else { return; }` skip in test_parity_pdb1_pdb2.rs and structure.rs's two tests; they now load unconditionally.
5. Fix stale docs: test_parity_curated_set.rs:3-11 (says the pdb1/pdb2 test "silently no-ops in CI"), test_parity_pdb1_pdb2.rs:1-4, tests/common/mod.rs:1-11.
6. Prove the tests assert: run `RUSTC_WRAPPER="" cargo test -p proxide-tmalign` with `HOME=/nonexistent` (so no USalign clone can be found) and paste the per-test `ok` lines for the pdb1/pdb2 tests and structure.rs's two tests. Then temporarily rename tests/data/PDB1.pdb, rerun, and confirm those tests FAIL (not pass); restore the file.
7. Commit only the files under crates/proxide-tmalign/ you changed or added (name them explicitly; never `git add -A`), message
   `test(tmalign): vendor USalign PDB1/PDB2 so sample-pair parity tests run in CI (#3789)`
   ending with:
   Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
   Claude-Session: https://claude.ai/code/session_01SbXt9g5fCHS6EFnoubG2Ft
'''
