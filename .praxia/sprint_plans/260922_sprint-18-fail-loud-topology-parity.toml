task_id: 260922_autonomous-loop

## VERIFY (decide each by command or line read, never by the fixer's report)
1. `sha256sum crates/proxide-tmalign/tests/data/PDB1.pdb crates/proxide-tmalign/tests/data/PDB2.pdb` equals 7fa7989c…f5b2 and 879c407d…c652 exactly.
2. NOTICE-USalign.md exists, names commit 177cc8a2bbd3…, both hashes, and contains USalign's LICENSE text verbatim (`diff` the LICENSE block against /home/marielle/repos/USalign/LICENSE).
3. `rg -n "else \{ return; \}|\.ok\(\)|USALIGN_REPO|repos/USalign" crates/proxide-tmalign/tests crates/proxide-tmalign/src/structure.rs` returns no loader/skip hits.
