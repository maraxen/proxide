backlog_id = "debt-1775"
phase_name = "Track A — parameterize_structure: entry-time bonded-index validation (debt #1775)"
fixer_prompt = '''
task_id: 260922_autonomous-loop

## Objective
An out-of-range atom index in a Topology term must make parameterize_structure return an error, never panic and never silently skip.

## Verified facts (do not re-derive; do check the lines still match before editing)
- crates/proxide-physics/src/physics/md_params.rs
  - L19: `pub enum ParamError` (thiserror, no #[non_exhaustive]). No code outside md_params.rs matches on its variants.
  - L145-148: `ParamOptions.strict` doc — scoped to the unparameterized_atoms report.
  - L169: `let n_atoms = processed.raw_atoms.num_atoms;`  L175 atom_types and L208 atom_classes are both length n_atoms.
  - Term loops that index per-atom arrays: bonds L541 and L664, angles L553 and L672, propers L567 (atom_classes[dih.i..l] at L568-576) and L721, impropers L622.
  - L728-737: a pairs_14 guard `if dih.i >= n_atoms || dih.l >= n_atoms { continue; }` with a "Defensive" comment. It is UNREACHABLE: L567-576 already index with the same dihedral and panic first.
- crates/proxide-core/src/forcefield/topology.rs: Topology { bonds: Vec<Bond>{i,j}, angles: Vec<Angle>{i,j,k}, proper_dihedrals / improper_dihedrals: Vec<Dihedral>{i,j,k,l} }.
- crates/proxide_py/src/py_parsers.rs:357 maps any ParamError to PyValueError via Display — a new variant needs no binding change.

## Steps
1. Add a variant, e.g.
   `#[error("topology {term} term {indices:?} references atom index >= n_atoms ({n_atoms})")]
    TopologyIndexOutOfRange { term: &'static str, indices: Vec<usize>, n_atoms: usize }`
   and mark `ParamError` `#[non_exhaustive]` (spec D4/D17 direction).
2. Immediately after L169, validate every index of every bonds/angles/proper_dihedrals/improper_dihedrals entry against n_atoms and return the first violation as TopologyIndexOutOfRange (term = "bond" | "angle" | "proper" | "improper"). Validation runs regardless of ParamOptions.strict.
3. Delete the unreachable L728-737 skip and its "Defensive" comment (the solvent-atom filter above it stays). Add one line to the `strict` doc comment (L145-148) stating it does not govern invariant violations such as out-of-range topology indices.
4. Tests in md_params.rs `mod tests` (reuse the fixture setup of `test_pairs_14_excludes_spurious_cross_water_bond`, L1874): `test_out_of_range_proper_index_is_an_error` and `test_out_of_range_bond_index_is_an_error`, each asserting `matches!(result, Err(ParamError::TopologyIndexOutOfRange { .. }))` — not a panic, not Ok. Confirm each test PANICS on the pre-change code (temporarily revert, or reason from L568) and report which you did.
5. Run `RUSTC_WRAPPER="" cargo test -p proxide-physics --lib` and `RUSTC_WRAPPER="" cargo check -p proxide_py`; paste the `test result:` lines.
6. Commit only md_params.rs with message
   `fix(physics): reject out-of-range topology indices instead of panicking (debt #1775)` plus a body naming the unreachable guard removed.
   End the message with:
   Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
   Claude-Session: https://claude.ai/code/session_01SbXt9g5fCHS6EFnoubG2Ft
Do not change any physical constant.
'''
reviewer_prompt = '''
task_id: 260922_autonomous-loop

## VERIFY (each item decided by running a command or reading a specific line — never by trusting the fixer's report)
1. `git diff --stat <base>..HEAD` touches only crates/proxide-physics/src/physics/md_params.rs.
2. ParamError has `TopologyIndexOutOfRange` and `#[non_exhaustive]`.
3. The validation sits before the first per-atom-array index (before L541's bonds loop) and covers bonds, angles, proper_dihedrals AND improper_dihedrals, checking every index (i,j[,k[,l]]).
4. No `continue` on `>= n_atoms` remains anywhere in parameterize_structure (`rg -n ">= n_atoms" crates/proxide-physics/src/physics/md_params.rs`).
5. Both new tests exist, use `matches!(.., Err(ParamError::TopologyIndexOutOfRange { .. }))`, and pass: `RUSTC_WRAPPER="" cargo test -p proxide-physics --lib out_of_range`.
6. Full `RUSTC_WRAPPER="" cargo test -p proxide-physics --lib` passes (compare count to 54+2) and `cargo check -p proxide_py` passes.
7. The `strict` doc comment states it does not govern invariant violations; no constant changed (`git diff` shows no numeric literal edits outside tests).
PASS = all 7 hold. FAIL = any fails; cite the item and evidence.
'''
return_key = "debt-1775"

