[[tracks.items]]
backlog_id = "1306"
phase_name = "Track D — Python bindings for proxide-confind, proxide-io, and proxide-master via PyO3 (#1306)"
fixer_prompt = """
BACKLOG DESCRIPTION:
Expose the core proxide surfaces to Python via PyO3 now that the parallel stack is stable.

Surfaces to wrap:
- **proxide-confind** — ConFind contact-degree algorithm; the primary research-facing surface. Python callers need run_confind(structure, ...) -> DataFrame or dict of contact results.
- **proxide-io** — PDB/FASTA/protobuf I/O; expose load_pdb(path) / load_pb(path) returning Python-friendly structure objects.
- **proxide-master** — parallel search; expose search(query, db, n_threads=None) with optional thread-count forwarding to proxide-parallel-rt.

Parallelism note: proxide-parallel-rt::set_num_threads() should be called from the Python side (or wired to a kwarg) so callers control thread count without touching global state.

Suggested crate: proxide-py (pyo3 + maturin). Target: PyPI wheel + conda-forge.

Blocked by: none. proxide-parallel-rt is stable; orx-parallel migration is merged.

[AUTO: no recon anchors — paste file:line references here, then write the full fixer prompt]"""
