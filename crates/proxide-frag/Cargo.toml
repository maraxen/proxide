[package]
name = "proxide-frag"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Backbone fragment search — Kabsch RMSD over fixed-length fragment databases (MASTER-style)"
keywords = ["protein", "rmsd", "structure", "search", "kabsch"]

[lib]
crate-type = ["rlib"]

[dependencies]
nalgebra = { workspace = true }
orx-parallel = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
proxide-parallel-rt = { path = "../proxide-parallel-rt" }
getrandom = { version = "0.2", features = ["js"] }

[[bench]]
name = "search_bench"
harness = false
