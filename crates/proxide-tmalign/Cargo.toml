[package]
name        = "proxide-tmalign"
version.workspace  = true
edition.workspace  = true
authors.workspace  = true
license.workspace  = true
repository.workspace = true
homepage.workspace = true
readme.workspace   = true
description = "TM-align structural alignment algorithm — Rust/orx-parallel reimplementation of Zhang Lab USalign/TMalign"
keywords    = ["protein", "structural-alignment", "tm-align", "structural-biology"]
categories  = ["science", "algorithms"]

[lib]
crate-type = ["rlib"]

# NOTE: the `tmalign` CLI bin ([[bin]]) and `bench_pairwise` criterion bench
# ([[bench]]) are added in later phases once pipeline.rs/parallel.rs exist
# (see .claude/plans/purring-seeking-beaver.md) — declaring them before
# their source files exist would break `cargo check`.

[dependencies]
proxide-core.workspace     = true
proxide-io.workspace       = true
nalgebra         = { workspace = true }
orx-parallel     = { workspace = true }
ndarray          = { version = "0.17.2", default-features = false, features = ["std"] }
thiserror        = { workspace = true }
log              = { workspace = true }

[dev-dependencies]
approx    = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
proxide-parallel-rt.workspace = true
getrandom = { version = "0.2", features = ["js"] }
