[package]
name        = "proxide-tmalign"
version.workspace  = true
edition.workspace  = true
authors.workspace  = true
license.workspace  = true
repository.workspace = true
homepage.workspace = true
readme.workspace   = true
description = "TM-align structural alignment algorithm — Rust/orx-parallel reimplementation of Zhang Lab USalign/TMalign"
keywords    = ["protein", "structural-alignment", "tm-align", "structural-biology"]
categories  = ["science", "algorithms"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "tmalign"
path = "src/bin/tmalign.rs"

# NOTE: `bench_pairwise` ([[bench]], criterion) is added once parallel.rs
# exists (Phase 3b, see .praxia/docs/specs/260729_proxide-tmalign-phases-2-5.md)
# — declaring it before the source file exists would break `cargo check`.

[dependencies]
proxide-core.workspace     = true
proxide-io.workspace       = true
nalgebra         = { workspace = true }
orx-parallel     = { workspace = true }
ndarray          = { version = "0.17.2", default-features = false, features = ["std"] }
thiserror        = { workspace = true }
log              = { workspace = true }

[dev-dependencies]
approx    = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
proxide-parallel-rt.workspace = true
getrandom = { version = "0.2", features = ["js"] }
