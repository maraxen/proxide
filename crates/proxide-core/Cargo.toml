[package]
name = "proxide-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Foundational data structures for protein parsing"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["protein", "bioinformatics", "pdb", "molecular-dynamics", "structure"]
categories = ["science", "data-structures"]

[package.metadata.docs.rs]
features = ["serde"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Linear algebra
nalgebra.workspace = true
bytemuck = "1.21.0"

quick-xml.workspace = true

# Unit system types
proxide-units.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }

# Logging
log.workspace = true
thiserror.workspace = true

# Random
rand.workspace = true
rand_distr.workspace = true

# Bundled CCD chem_comp_type reference data (chem::ccd)
prost = "0.13"
zstd = "0.13"

[build-dependencies]
prost-build = "0.13"
# Vendored protoc binary so the build never depends on a system-installed
# protoc -- required for CI wheel builds (Windows/macOS/manylinux Docker
# runners have no protoc preinstalled; see build.rs).
protoc-bin-vendored = "3.2.0"

[features]
default = []
serde = ["dep:serde"]
testing = []

# `rand`/`rand_distr` pull in `getrandom`, which refuses to compile for
# wasm32-unknown-unknown without the "js" feature. proxide-io and
# proxide-frag already declare this; proxide-core needs its own copy
# because cargo-hack checks each crate via its own --manifest-path, so
# feature unification with a sibling crate's override doesn't apply unless
# that sibling is actually in this crate's own dependency graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
