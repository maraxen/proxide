[package]
name = "proxide-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Foundational data structures for protein parsing"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# Linear algebra
nalgebra.workspace = true
bytemuck = "1.21.0"

quick-xml.workspace = true

# Unit system types
proxide-units.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }

# Logging
log.workspace = true
thiserror.workspace = true

# Random
rand.workspace = true
rand_distr.workspace = true

[features]
default = []
serde = ["dep:serde"]
testing = []
