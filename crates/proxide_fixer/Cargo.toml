[package]
name = "proxide_fixer"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Protein structure sanitization and repair for proxide"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["protein", "bioinformatics", "structure", "repair", "sanitization"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
proxide_rs = { workspace = true }
proxide-geometry = { workspace = true }
proxide-rotlib = { workspace = true }
nalgebra.workspace = true
thiserror.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log.workspace = true

[dev-dependencies]
proxide-io = { workspace = true }
proxide-core = { workspace = true }
proxide-confind = { workspace = true }
proxide-rotlib = { workspace = true }

[features]
protonation = []
capping = []
stereo = []
disulfide = []

[lib]
crate-type = ["rlib"]
