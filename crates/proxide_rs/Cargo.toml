[package]
name = "proxide_rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "High-performance Rust parsing core for protein structures"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
proxide-core = { workspace = true }
proxide-geometry = { workspace = true }
proxide-physics = { workspace = true }
proxide-gaff = { workspace = true }
proxide-io = { workspace = true }

# Logging
log.workspace = true

# Error handling
thiserror.workspace = true

# Lazy initialization
lazy_static.workspace = true
once_cell.workspace = true

# Linear algebra
nalgebra.workspace = true

# Random number generation
rand.workspace = true
rand_distr.workspace = true

# Optional dependencies
reqwest = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
bytemuck = "1.25.0"

[features]
default = ["xtc", "parallel"]
fetching = ["proxide-io/fetching", "dep:reqwest"]
hdf5 = ["proxide-io/hdf5"]
foldcomp = ["proxide-io/foldcomp"]
xtc = ["proxide-io/xtc"]
parallel = ["proxide-io/parallel", "dep:rayon"]
full = ["fetching", "hdf5", "foldcomp", "xtc", "parallel"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
