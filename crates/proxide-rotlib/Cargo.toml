[package]
name        = "proxide-rotlib"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
description = "Backbone-dependent rotamer library for protein sidechain placement"
keywords    = ["rotamer", "sidechain", "backbone", "structural-biology"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "convert_rotlib"
path = "src/bin/convert_rotlib.rs"

[[bin]]
name = "parse_master"
path = "src/bin/parse_master.rs"

[dependencies]
thiserror = { workspace = true }
tracing   = "0.1"
proxide-geometry = { path = "../proxide-geometry" }
proxide-core = { path = "../proxide-core" }
prost    = "0.13"
zstd     = "0.13"
clap = { version = "4.4", features = ["derive"] }

[dependencies.serde]
version  = "1"
optional = true
features = ["derive"]

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"

[features]
default = []
serde   = ["dep:serde"]
