[package]
name = "proxide_py"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Python bindings for proxide_rs"
license.workspace = true
publish = false

[lib]
name = "_proxider"
crate-type = ["cdylib"]

[dependencies]
proxide_rs = { workspace = true }
proxide-units = { workspace = true }
proxide-gaff = { workspace = true }
# Optional, NOT in `full`/`default` -- GPL-2.0-or-later (see
# crates/proxide-gaff2/NOTICE). Linking it into this crate's cdylib output
# (`_proxider.so`, the actual distributed Python extension -- see
# .github/workflows/publish.yml) makes that binary a GPL-encumbered combined
# work. Gated behind the `gaff2-engine` feature so the standard published
# wheel (built with default features) stays pure MIT with the old heuristic
# `assign_gaff_atom_types` behavior; only a deliberate
# `--features gaff2-engine` build gets the real, validated GAFF2 typer. See
# `assign_gaff_atom_types` in src/py_chemistry.rs and
# .praxia/docs/reference/260821_gaff2-rust-port-lessons.md's Cutover section.
proxide-gaff2 = { workspace = true, optional = true }
proxide-geometry = { workspace = true }
proxide-jaccard = { workspace = true }
proxide-tmalign = { workspace = true }
bytemuck = "1.21.0"
pyo3 = { workspace = true, features = ["extension-module"] }
numpy = { workspace = true }
nalgebra.workspace = true
pyo3-log = { workspace = true }
log = "0.4"
molly = { workspace = true, optional = true }

[features]
default = ["full"]
fetching = ["proxide_rs/fetching"]
hdf5 = ["proxide_rs/hdf5"]
xtc = ["proxide_rs/xtc", "dep:molly"]
parallel = ["proxide_rs/parallel"]
foldcomp = ["proxide_rs/foldcomp"]
full = ["fetching", "hdf5", "xtc", "parallel", "foldcomp"]
# Deliberately excluded from `full`/`default` -- see the proxide-gaff2
# dependency comment above.
gaff2-engine = ["dep:proxide-gaff2"]
