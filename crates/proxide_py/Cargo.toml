[package]
name = "proxide_py"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Python bindings for proxide_rs"
license.workspace = true
publish = false

# This is the MIT-only manifest that maturin builds the published wheels and the
# sdist from (pyproject.toml [tool.maturin] manifest-path). It must not name the
# GPL-2.0-or-later crates (proxide-gaff2, proxide-ligand-frame), not even as
# optional dependencies: maturin leaves their sources out of the sdist, and Cargo
# cannot resolve a path dependency whose manifest is missing (debt #3181).
#
# The GPL engines are bound by crates/proxide_py_gpl, which compiles these same
# sources (src/) with the `gaff2-engine` and `ligand-frame` features. See that
# manifest for the opt-in source build.

[lib]
name = "_proxider"
crate-type = ["cdylib"]

[dependencies]
proxide_rs = { workspace = true }
proxide-units = { workspace = true }
proxide-gaff = { workspace = true }
proxide-geometry = { workspace = true }
proxide-jaccard = { workspace = true }
proxide-tmalign = { workspace = true }
bytemuck = "1.21.0"
pyo3 = { workspace = true, features = ["extension-module"] }
numpy = { workspace = true }
nalgebra.workspace = true
pyo3-log = { workspace = true }
log = "0.4"
molly = { workspace = true, optional = true }

[features]
default = ["full"]
fetching = ["proxide_rs/fetching"]
hdf5 = ["proxide_rs/hdf5"]
xtc = ["proxide_rs/xtc", "dep:molly"]
parallel = ["proxide_rs/parallel"]
foldcomp = ["proxide_rs/foldcomp"]
full = ["fetching", "hdf5", "xtc", "parallel", "foldcomp"]

[lints.rust]
# src/ is shared with crates/proxide_py_gpl, which declares these two features.
# Here they are never enabled, so the gated code is compiled out.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gaff2-engine", "ligand-frame"))'] }
