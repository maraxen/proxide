<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proxide WASM — HP4-WASM Smoke Demo</title>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 2em auto; padding: 0 1em; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 1em; overflow: auto; border-radius: 4px; }
    .ok { color: #4ec9b0; }
    .err { color: #f44747; }
    input { width: 400px; padding: 4px; font-family: monospace; }
    button { padding: 4px 12px; cursor: pointer; }
  </style>
</head>
<body>
<h2>Proxide WASM — HP4-WASM Smoke Demo</h2>

<p>
  SMILES: <input id="smiles" value="c1ccccc1" />
  <button onclick="run()">Assign GAFF2 params</button>
</p>

<pre id="output">Loading WASM...</pre>

<script type="module">
import init, { smiles_to_params, version } from "../pkg/proxide_wasm.js";

let ready = false;

async function loadWasm() {
  await init();
  ready = true;
  document.getElementById("output").textContent =
    `proxide-wasm v${version()} ready.\n\nEnter a SMILES string and click the button, or wait for the auto-demo.`;

  // Auto-demo: run 5 molecules
  const demos = [
    { name: "methane",  smiles: "C"         },
    { name: "ethane",   smiles: "CC"        },
    { name: "ethanol",  smiles: "CCO"       },
    { name: "benzene",  smiles: "c1ccccc1"  },
    { name: "acetone",  smiles: "CC(=O)C"  },
  ];

  let log = `proxide-wasm v${version()} — auto-demo\n${"=".repeat(50)}\n\n`;

  for (const { name, smiles } of demos) {
    try {
      const json = smiles_to_params(smiles);
      const params = JSON.parse(json);
      log += `✓ ${name} (${smiles})\n`;
      log += `  atoms: ${params.atoms.length}, bonds: ${params.bonds.length}, angles: ${params.angles.length}, torsions: ${params.torsions.length}\n`;
      if (params.bonds.length > 0) {
        const b = params.bonds[0];
        log += `  first bond: ${b.type_pair.join("-")}  r0=${b.r0.toFixed(4)} nm  k=${b.k.toFixed(1)} kJ/mol/nm²\n`;
      }
      log += "\n";
    } catch (e) {
      log += `✗ ${name} (${smiles}): ${e}\n\n`;
    }
  }

  log += "HP4-WASM smoke test COMPLETE — check console for full JSON.\n";
  document.getElementById("output").className = "ok";
  document.getElementById("output").textContent = log;

  // Log first molecule full JSON to console for manual inspection
  try {
    const json = smiles_to_params("CC");
    console.log("HP4-WASM ethane params:", JSON.parse(json));
  } catch(e) {
    console.error("HP4-WASM error:", e);
  }
}

window.run = function() {
  if (!ready) { alert("WASM not loaded yet"); return; }
  const smiles = document.getElementById("smiles").value.trim();
  try {
    const json = smiles_to_params(smiles);
    const params = JSON.parse(json);
    document.getElementById("output").textContent = JSON.stringify(params, null, 2);
    document.getElementById("output").className = "ok";
  } catch(e) {
    document.getElementById("output").textContent = "Error: " + e;
    document.getElementById("output").className = "err";
  }
};

loadWasm().catch(e => {
  document.getElementById("output").textContent = "Failed to load WASM: " + e;
  document.getElementById("output").className = "err";
  console.error(e);
});
</script>
</body>
</html>
