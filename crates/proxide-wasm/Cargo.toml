[package]
name = "proxide-wasm"
version.workspace = true
edition.workspace = true
description = "WASM-compilable SMILES + GAFF2 bonded-parameter resolver"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nom.workspace = true
purr = "0.9"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
